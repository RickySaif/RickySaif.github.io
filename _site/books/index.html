<script>
  const sidebarMenu = document.querySelector('.site-top-menu');
  const checkbox = document.getElementById('site-menu-toggle');
  let lastScrollY = 0;
  
  if (sidebarMenu && checkbox) {
    window.addEventListener('scroll', () => {
      const currentScrollY = window.scrollY;
      
      if (currentScrollY > lastScrollY && currentScrollY > 100) {
        // Scrolling down - collapse sidebar by checking checkbox
        checkbox.checked = true;
      }
      // Don't auto-expand on scroll up - keep collapsed with button visible
      
      lastScrollY = currentScrollY;
    });
    
    // Handle button clicks to remove collapsed class when expanding
    checkbox.addEventListener('change', () => {
      if (!checkbox.checked) {
        // Menu is being opened - remove collapsed class
        sidebarMenu.classList.remove('collapsed');
      }
    });
  }
</script>
