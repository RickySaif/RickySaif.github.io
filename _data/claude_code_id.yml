      - time: "Menit 16"
        title: "Versi pertama"
        text: "Dua bahasa dan desainnya, sudah ia tes sendiri di layar laptop dan HP."
      - time: "Total 38 menit"
        title: "Versi akhir"
        text: "Untuk setiap catatan bernomor dari saya, ia memperbaiki lalu mengecek ulang."
