en:
  hero:
    label: "AI Community (Agentic Indonesia)"
    title_html: 'In This Economy, Don''t Want to Fire or Get Fired? <span class="cc-grad">Here''s the Answer</span>'
    lead: "There's a new superpower called AI Agents. It can grow your revenue. Work gets faster, cheaper and more efficient too. Anyone can use it. If you don't want to learn this superpower, you'll be the one left behind in this economy.<br><span class='cc-lead-gap'></span>Agentic Indonesia is a free WhatsApp group with step-by-step tutorials and weekly online meetups.<br><span class='cc-lead-gap'></span>Don't let your competitors learn it first."
    cta_wa: "Join the WhatsApp group"
    cta_meetup: "Register for the online meetup"
    next_label: "Next online meetup"
  terminal:
    note: "Illustration"
    nav_label: "Choose an example"
    scenes:
      - title: "claude · budget-app"
        tab: "App"
        icon: phone
