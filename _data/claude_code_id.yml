  community:
    eyebrow: "Win big"
    title: "One community, three things you get"
    intro: "Claude Code ID is a WhatsApp community for anyone who wants to start using Claude Code. It's free, and you don't need to code first."
    features:
      - icon: book
        title: "A step-by-step tutorial"
        text: "One step, one group. Start from zero and follow the order."
      - icon: chat
        title: "Ask in the right place"
        text: "Stuck on a step? Ask in that step's group. Anyone can answer."
      - icon: pin
        title: "Meetups in Jakarta"
        text: "Meet in person, ask anything, and watch a live demo."
    course:
      eyebrow: "Guided. One step at a time."
      title: "One step, one group"
      intro: "The tutorial is split across groups, in order. Each group has its instructions in the group bio: the step to follow. Questions about a step stay in that step's group, so they don't get lost in other chat. The lessons are written in Indonesian."
      howto_title: "How it works"
      howto:
        - "Join the groups in order"
        - "Open the group bio and follow the steps"
        - "Stuck? Ask in that group. Anyone can answer."
      chip: "There are no stupid questions"
      groups_alt: "The list of groups in the Claude Code ID WhatsApp community, from P-00 Setup to D-00 Start Here"
      lesson_label: "Group bio"
      lesson_alt: "The D-04 First App group bio: the steps to build a first app with Claude Code, in Indonesian"
      tracks_title: "Four tracks. Pick the one you need."
      tracks:
        - code: D
          name: "Development"
          text: "Build apps. 14 groups in order, from zero to an app that is live and monitored."
        - code: V
          name: "Video Production"
          text: "Make videos with Claude Code."
        - code: M
          name: "Marketing"
          text: "Claude Code for marketing work."
        - code: P
          name: "Paper Works"
          text: "Documents and office work."
      start_label: "Start with"
      general_html: "There are general groups too: <strong>Ngobrol</strong> for open chat, <strong>Member Showcase</strong> for members' work, and <strong>Kopdar</strong> for meetup info &amp; documentation."
    meetup_title: "Next meetup"
    meetup_more: "See all events"
    invite_alt: "Claude Code ID WhatsApp group invite"
    invite_caption: "Click the image to join the WhatsApp group"
  why:
    eyebrow: "Why it matters"
    title: "Why Claude Code will change the way we work"
    intro: "Have an idea for an app or a website? Until now you had two choices."
    paths:
      - label: "Choice 1"
        title: "Spend years learning to code"
        text: "Slow, and not everyone has the time."
      - label: "Choice 2"
        title: "Pay a developer, then wait"
        text: "Expensive, and often weeks in a queue."
      - label: "Choice 3 · New"
        title: "Explain it, and Claude Code does the work"
        text: "You focus on the problem. It writes the code."
    what_title: "What is Claude Code?"
    what_text: "Claude Code is an AI from Anthropic that works directly on your computer. You explain what you want in everyday language. Bahasa Indonesia works too."
    loop:
      - "You explain the goal"
      - "It creates files and writes the code"
      - "It runs it and checks the result"
      - "You judge it and give feedback"
    loop_note: "Before it does anything important, it asks for your permission."
    vs_title: "How it differs from a chatbot"
    chat_label: "A regular chatbot"
    chat_user: "How do I make a landing page?"
    chat_bot: "Here is some example code you can copy:"
    chat_after: "You copy it, try it, and fix it when it breaks."
    cc_label: "Claude Code"
    cc_user: "Build a landing page for my cake shop."
    cc_steps:
      - "Creates the files"
      - "Runs it in a browser"
      - "Fixes its own errors"
    cc_after: "You just judge the result."
    analogy_html: "A chatbot is like a <strong>consultant on the phone</strong>: good advice, but you do the work yourself. Claude Code is like a <strong>builder who comes to your house</strong> with tools. It does the work, and it still asks before it knocks down a wall."
  create:
    eyebrow: "Not only code"
    title_html: 'It''s called Claude <s class="cc-strike">Code</s>. It should be called Claude <span class="cc-create-word">Create</span>.'
    intro: "Code is just the tool. The result can be anything digital: animations, documentaries, explainers, PDFs, slides, and yes, websites."
    formats:
      - icon: play
        title: "Animation"
        text: "Motion graphics and animated videos"
      - icon: film
        title: "Documentary video"
        text: "Footage, narration and captions, put together"
      - icon: spark
        title: "Explainers"
        text: "Visual explanations that are easy to follow"
      - icon: file
        title: "PDFs & ebooks"
        text: "Reports, proposals, print-ready ebooks"
      - icon: slides
        title: "Slide decks"
        text: "A tidy deck from your notes"
      - icon: chart
        title: "Data & reports"
        text: "Clean up spreadsheets, draw charts"
      - icon: image
        title: "Infographics & posters"
        text: "Visuals for social media and print"
      - icon: globe
