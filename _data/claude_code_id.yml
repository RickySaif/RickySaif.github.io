      - "Anda menjelaskan tujuannya"
      - "Ia membuat file dan menulis kode"
      - "Ia menjalankan dan mengecek hasilnya"
      - "Anda menilai dan memberi masukan"
    loop_note: "Sebelum melakukan hal penting, ia minta izin dulu."
    vs_title: "Bedanya dengan chatbot"
    chat_label: "Chatbot biasa"
    chat_user: "Bagaimana cara membuat landing page?"
    chat_bot: "Ini contoh kodenya, silakan disalin:"
    chat_after: "Anda yang menyalin, mencoba, dan memperbaiki kalau error."
    cc_label: "Claude Code"
    cc_user: "Buatkan landing page untuk toko kue saya."
    cc_steps:
      - "Membuat file"
      - "Menjalankan di browser"
      - "Memperbaiki error-nya sendiri"
    cc_after: "Anda tinggal menilai hasilnya."
    analogy_html: "Chatbot itu seperti <strong>konsultan di telepon</strong>: sarannya bagus, tapi Anda sendiri yang turun tangan. Claude Code seperti <strong>tukang yang datang ke rumah</strong> membawa perkakas. Ia yang mengerjakan, dan tetap minta izin sebelum membongkar tembok."
  create:
    eyebrow: "Bukan cuma kode"
    title_html: 'Namanya Claude <s class="cc-strike">Code</s>. Harusnya Claude <span class="cc-create-word">Create</span>.'
    intro: "Kode hanya alatnya. Hasilnya bisa apa saja yang digital: animasi, video dokumenter, explainer, PDF, slide, sampai website."
    formats:
