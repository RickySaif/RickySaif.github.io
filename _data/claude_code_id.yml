        - ad: "Solusi terbaik untuk bisnis Anda"
          ctr: "0,4%"
          fix: "Hemat 6 jam kerja tiap minggu"
          len: "29/30"
        - ad: "Gratis konsultasi pertama"
          ctr: "3,1%"
