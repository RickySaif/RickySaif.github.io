      before_note: "Game designer, ilustrator pixel art, dua programmer (satu khusus pengenalan suara), dan penguji"
      caption: "Angka “sebelum ada AI” adalah perkiraan kami untuk game seukuran versi pertama Kebun Makna."
    closing: "Ia tidak memulai dari teknologi. Ia memulai dari hal yang paling ia pahami: cara anak belajar."
    launched: "Kebun Makna sudah diluncurkan. Coba sekarang di km.generasimerdeka.com"
    cta_url: "https://km.generasimerdeka.com"
    cta: "Coba Kebun Makna"
    shots:
