          - label: "remotion.dev"
            url: "https://www.remotion.dev/docs/ai/skills"
      - tag: "Video promosi · Ricky Saif"
        title: "Video di halaman ini"
        text: "Video 1 menit 45 detik di cerita 2 dibuat dengan Claude Code dan repo OpenMontage, alat produksi video open-source: dari rekaman layar mentah sampai narasi, teks, dan render akhir."
        links:
          - label: "Tonton di bawah"
            url: "#video"
