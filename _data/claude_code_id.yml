      - label: "Versi pertama"
        value_html: "2 jam"
      - label: "Harga"
        value_html: "Gratis"
    badge: "Versi pertama: 2 jam"
    closing: "Ia tidak memulai dari teknologi. Ia memulai dari hal yang paling ia pahami: cara anak belajar."
    beta: "Kebun Makna sedang tahap Beta Testing. Minat bantu menyempurnakannya?"
    cta: "Coba Kebun Makna"
    shots:
      - file: kebun-makna-builder.jpg
