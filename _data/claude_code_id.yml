# Words for /claude-code-id/ (template: _includes/claude-code-id.html).
# One block per language; both blocks have the same keys. Values ending in
# _html may contain markup. Meetup dates and places come from _data/events.yml.

# The Development track's groups in the WhatsApp community, in order. These
# are the groups' real names, so they are the same in both languages.
d_track:
  - "D-00 Start Here"
  - "D-01 Why Claude Code"
  - "D-02 Setup"
  - "D-03 Terminal 101"
  - "D-04 First App"
  - "D-05 CLAUDE.md"
  - "D-06 Git & GitHub"
  - "D-07 Supabase"
  - "D-08 Google Login"
  - "D-09 E2E Testing"
  - "D-10 Bug Hunting"
  - "D-11 Publish"
  - "D-12 Analytics"
  - "D-13 Observability"

id:
  hero:
    badge: "Komunitas gratis · Jakarta"
    title_html: 'Belajar <span class="cc-grad">Claude Code</span> Gratis & Bareng-bareng.'
    lead: "Grup WhatsApp dengan tutorial langkah demi langkah gratis, teman untuk bertanya, dan kopdar di Jakarta."
    cta_wa: "Gabung grup WhatsApp"
    cta_meetup: "Daftar kopdar"
    next_label: "Kopdar berikutnya"
  # Hero terminal: plays each scene in turn. The last step is the "done" line.
  # result.type picks the illustration (app, video or slides). The chip (tag)
  # comes 2.5s after the result, or 2s before it when chip_first is true.
  terminal:
    note: "Ilustrasi"
    nav_label: "Pilih contoh"
    scenes:
      - title: "claude · catatan-keuangan"
        tab: "Aplikasi"
        icon: phone
        prompt: "Buatkan aplikasi pencatat anggaran dan pengeluaran yang akan selalu saya pakai."
        steps:
          - "Membaca permintaan, menyusun rencana"
          - "Membuat aplikasi: catat dalam 3 ketukan, kategori, ringkasan bulanan"
          - "Mengetes di browser dan di layar HP"
          - "Selesai. Siap Anda pakai."
        chip_icon: repeat
        chip: "Atur sampai sempurna"
        result:
          type: app
          title: "Anggaran Saya"
          month: "Nov"
          label: "Sisa bulan ini"
          value: "Rp 2.350.000"
          cats:
            - name: "Makan"
              amount: "1,2 jt"
            - name: "Transport"
              amount: "450 rb"
            - name: "Belanja"
              amount: "800 rb"
      - title: "claude · ~/Downloads"
        tab: "Video"
        icon: film
        prompt: "Render 10 video mentah di folder Downloads jadi satu video yang berpotensi viral."
        steps:
          - "Menonton 10 video, mencari momen terbaik"
          - "Menaruh hook di 3 detik pertama, menambah teks dan musik"
          - "Me-render video vertikal 9:16"
          - "Selesai. Video siap diunggah."
        chip_icon: film
        chip: "Bisa ditinggal nonton drakor"
        chip_first: true
        result:
          type: video
          clips: "10 video → 1"
          caption: "Tunggu sampai detik terakhir…"
          length: "0:45"
      - title: "claude · laporan-mingguan"
        tab: "Laporan"
        icon: slides
        prompt: "Ambil performa tim terbaru dari Google Spreadsheet, tambahkan tren Instagram minggu ini, lalu susun jadi laporan mingguan di Google Slides."
        steps:
          - "Membaca performa tim dari Google Spreadsheet"
          - "Mencari tren Instagram minggu ini"
          - "Menyusun laporan di Google Slides"
          - "Selesai. Link slide siap dibagikan."
        chip_icon: coffee
        chip: "Bisa ditinggal bikin kopi"
        chip_first: true
        result:
          type: slides
          file: "Laporan Mingguan Tim"
          slide_title: "Performa tim minggu ini"
          trend_label: "Tren Instagram"
          trends: ["Reels pendek", "Carousel"]
