  why:
    title: "Why AI Agents will change the way we work"
    intro: "Need a video, a report, an analysis or an app? Until now you had two choices."
    paths:
      - label: "Choice 1"
        title: "Spend years learning it yourself"
        text: "Editing, coding, data work: slow, and not everyone has the time."
      - label: "Choice 2"
        title: "Pay an expert, then wait"
        text: "Expensive, and often weeks in a queue."
      - label: "Choice 3 · New"
        title: "Explain it, and an AI Agent does the work"
        text: "You focus on the problem. It does the work."
    what_title: "What is an AI Agent?"
    what_text: "An AI Agent is an AI that works directly on your computer, on its own. You explain what you want in everyday language. Bahasa Indonesia works too."
    loop:
      - "You explain the goal"
      - "It creates files, writes code, crunches data"
      - "It runs it and checks the result"
      - "You judge it and give feedback"
    loop_note: "Before it does anything important, it asks for your permission."
    vs_title: "How it differs from AI chat"
    chat_label: "A regular AI chat (needs more prompting skill)"
    chat_user: "How do I make a landing page?"
    chat_bot: "Here is some example code you can copy:"
    chat_after: "You copy it, try it, and fix it when it breaks."
    cc_label: "Agentic AI"
    cc_user: "Build a landing page for my cake shop."
    cc_steps:
      - "Creates the files"
      - "Runs it in a browser"
      - "Fixes its own errors"
    cc_after: "You just judge the result."
    tools_label: "Examples"
    tools_hint: "Hover or tap one to see who makes it."
    tools_chat:
      - {name: "ChatGPT", pair: "openai"}
      - {name: "Claude Web", pair: "anthropic"}
      - {name: "Gemini", pair: "google"}
    tools_agent:
      - {name: "Codex", pair: "openai"}
      - {name: "Claude Desktop", pair: "anthropic"}
      - {name: "Antigravity", pair: "google"}
      - {name: "Hermes", pair: "nous"}
    tools_pairs:
      openai: {company: "OpenAI", from: "ChatGPT", to: "Codex", text: "One company, two ways to use it: ChatGPT to talk, Codex to get things done."}
      anthropic: {company: "Anthropic", from: "Claude Web", to: "Claude Desktop", text: "One company, two ways to use it: Claude Web to talk, Claude Desktop to get things done."}
      google: {company: "Google", from: "Gemini", to: "Antigravity", text: "One company, two ways to use it: Gemini to talk, Antigravity to get things done."}
      nous: {company: "Nous Research", from: "Hermes", text: "Hermes is made by Nous Research, an independent AI lab."}
    tools_made_by: "Made by"
    analogy_html: "AI chat is like a <strong>consultant on the phone</strong>: good advice, but you do the work yourself. An AI Agent is like a <strong>builder who comes to your house</strong> with tools."
    bridge: "The best place to learn AI Agents?"
    roles_title: "Whoever you are, there's work it can take off your hands"
    roles_intro: "If the result is digital, an AI Agent can most likely help you make it. A few examples:"
    roles:
      - icon: store
        title: "Shop owners"
        text: "A product catalogue, promo photos and their own online shop. Answers to the same customer questions, every day."
      - icon: chart
        title: "Marketers"
        text: "Dissect hundreds of ads, write new variations, and put together the campaign report every Monday morning."
      - icon: film
        title: "Content creators"
        text: "Cut long videos into short clips, with captions, music and thumbnails."
      - icon: school
        title: "Teachers"
        text: "Lessons, interactive quizzes, animated explanations and a whole class's grade summary."
      - icon: home
        title: "Parents"
        text: "A learning game made for their own child, like Kebun Makna."
      - icon: file
        title: "Consultants"
        text: "Market research, reports, proposals and client slides from messy meeting notes."
      - icon: users
        title: "HR & recruiters"
        text: "Screen hundreds of CVs against clear criteria, write test questions and onboarding material."
      - icon: search
        title: "Researchers & students"
        text: "Summarise dozens of papers, process survey data and draw charts ready for the defence."
      - icon: briefcase
        title: "Finance & admin"
        text: "Reconcile spreadsheets, find the numbers that don't add up, and automate the monthly report."
      - icon: book
        title: "Writers"
        text: "A print-ready ebook, consistency checks on the manuscript, and a landing page for the book."
      - icon: shield
        title: "Legal"
        text: "Compare contract versions and flag the clauses a person should read again."
      - icon: terminal
        title: "Developers"
        text: "Write, test and fix code, even in a project it has never seen before."
    roles_outro_html: "Want Indonesia to move forward while you earn extra income? <strong>Help everyone above use AI</strong> to work more effectively &amp; efficiently."
