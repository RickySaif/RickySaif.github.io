  creator:
    eyebrow: "Bukan programmer. Kreator."
    title: "Tujuannya bukan jadi programmer. Tujuannya jadi kreator."
    intro: "Anda tidak perlu menghafal kode. Yang Anda perlukan: paham masalahnya, tahu hasil yang Anda mau, dan bisa menilai hasilnya."
