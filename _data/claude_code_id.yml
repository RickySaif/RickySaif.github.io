  story2:
    eyebrow: "Cerita 2 · Dari saya"
    title: "Landing page dua bahasa dalam 38&nbsp;menit"
    counter_unit: "menit"
    counter_label: "Waktu kerja Claude, dari brief sampai versi akhir"
    intro: "Saya ingin mengusulkan tambahan untuk Scrum Guide di era AI. Untuk itu, saya butuh website."
    brief: "Syaratnya tidak sedikit. Dua bahasa, Inggris dan Indonesia. Ada blog-nya. Di-hosting di GitHub Pages. Dan setiap kutipan harus sama persis dengan Scrum Guide resminya."
    video_caption: "Rekaman prosesnya, dipercepat jadi 1 menit 45 detik. Bahasa Inggris, dengan teks."
