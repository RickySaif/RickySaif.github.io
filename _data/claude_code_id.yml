# Words for /komunitas-ai/ (template: _includes/claude-code-id.html).
# One block per language; both blocks have the same keys. Values ending in
# _html may contain markup. Meetup dates and places come from _data/events.yml.

# The Development track's groups in the WhatsApp community, in order. These
# are the groups' real names, so they are the same in both languages.
d_track:
  - "D-00 Start Here"
  - "D-01 Why Claude Code"
  - "D-02 Setup"
  - "D-03 Terminal 101"
  - "D-04 First App"
  - "D-05 CLAUDE.md"
  - "D-06 Git & GitHub"
  - "D-07 Supabase"
  - "D-08 Google Login"
  - "D-09 E2E Testing"
  - "D-10 Bug Hunting"
  - "D-11 Publish"
  - "D-12 Analytics"
  - "D-13 Observability"

id:
  hero:
    label: "Komunitas AI (Agentic Indonesia)"
    title_html: 'In This Economy, Ga Mau Memecat/Dipecat? <span class="cc-grad">Ini Solusinya</span>'
    lead: "Ada superpower baru bernama Agen AI. Dia bisa tingkatkan pemasukan. Proses juga jadi lebih cepat, hemat, dan efisien. Bisa dipakai oleh siapa saja. Kalau ga mau belajar superpower ini, yang bakal ketinggalan in this economy.<br><span class='cc-lead-gap'></span>Agentic Indonesia adalah grup WhatsApp gratis berisi tutorial langkah-demi-langkah dan meetup online setiap minggu.<br><span class='cc-lead-gap'></span>Jangan sampai kompetitor-kompetitor kamu belajar duluan."
    cta_wa: "Gabung grup WhatsApp"
    cta_meetup: "Daftar meetup online"
    next_label: "Meetup online berikutnya"
  # Hero terminal: plays each scene in turn. The last step is the "done" line.
  # result.type picks the illustration (app, video or slides). The chip (tag)
  # comes 2.5s after the result, or 2s before it when chip_first is true.
  terminal:
    note: "Ilustrasi"
    nav_label: "Pilih contoh"
    scenes:
      - title: "claude · catatan-keuangan"
        tab: "Aplikasi"
        icon: phone
        prompt: "Buatkan aplikasi pencatat anggaran dan pengeluaran yang akan selalu saya pakai."
        steps:
          - "Membaca permintaan, menyusun rencana"
          - "Membuat aplikasi: catat dalam 3 ketukan, kategori, ringkasan bulanan"
          - "Mengetes di browser dan di layar HP"
          - "Selesai. Siap Anda pakai."
        chip_icon: repeat
        chip: "Atur sampai sempurna"
        result:
          type: app
          title: "Anggaran Saya"
          month: "Nov"
          label: "Sisa bulan ini"
          value: "Rp 2.350.000"
          cats:
            - name: "Makan"
              amount: "1,2 jt"
            - name: "Transport"
              amount: "450 rb"
            - name: "Belanja"
              amount: "800 rb"
      - title: "claude · ~/Downloads"
        tab: "Video"
        icon: film
        prompt: "Render 10 video mentah di folder Downloads jadi satu video yang berpotensi viral."
        steps:
          - "Menonton 10 video, mencari momen terbaik"
          - "Menaruh hook di 3 detik pertama, menambah teks dan musik"
          - "Me-render video vertikal 9:16"
          - "Selesai. Video siap diunggah."
        chip_icon: film
        chip: "Bisa ditinggal nonton drakor"
        chip_first: true
        result:
          type: video
          clips: "10 video → 1"
          caption: "Tunggu sampai detik terakhir…"
          length: "0:45"
      - title: "claude · laporan-mingguan"
        tab: "Laporan"
        icon: slides
        prompt: "Ambil performa tim terbaru dari Google Spreadsheet, tambahkan tren Instagram minggu ini, lalu susun jadi laporan mingguan di Google Slides."
        steps:
          - "Membaca performa tim dari Google Spreadsheet"
          - "Mencari tren Instagram minggu ini"
          - "Menyusun laporan di Google Slides"
          - "Selesai. Link slide siap dibagikan."
        chip_icon: coffee
        chip: "Bisa ditinggal bikin kopi"
        chip_first: true
        result:
          type: slides
          file: "Laporan Mingguan Tim"
          slide_title: "Performa tim minggu ini"
          trend_label: "Tren Instagram"
          trends: ["Reels pendek", "Carousel"]
  community:
    title: "Satu komunitas, tiga hal yang Anda dapat"
    intro: "Agentic Indonesia adalah komunitas WhatsApp untuk siapa saja yang ingin mulai belajar Agen AI. Gratis, dan tidak perlu bisa coding dulu."
    features:
      - icon: book
        title: "Tutorial langkah demi langkah"
        text: "Satu langkah, satu grup. Mulai dari nol, ikuti urutannya."
      - icon: chat
        title: "Tanya di tempat yang tepat"
        text: "Mentok di satu langkah? Tanya di grup langkah itu. Siapa pun boleh jawab."
      - icon: pin
        title: "Meetup online mingguan"
        text: "Ketemu lewat online, tanya apa saja, dan lihat live demo."
    course:
      title: "Satu langkah, satu grup, dibimbing pelan-pelan"
      intro: "Tutorialnya dibagi ke beberapa grup yang berurutan. Tiap grup punya petunjuk di bio grupnya: langkah yang perlu Anda ikuti. Pertanyaan soal satu langkah tetap di grup langkah itu, jadi tidak tenggelam di obrolan lain."
      howto_title: "Cara pakainya"
      howto:
        - "Masuk grup sesuai urutan"
        - "Buka bio grup, lalu ikuti langkahnya"
        - "Mentok? Tanya di grup itu. Siapa pun boleh jawab."
      chip: "Tidak ada pertanyaan bodoh"
      groups_alt: "Daftar grup di komunitas WhatsApp Agentic Indonesia, dari P-00 Setup sampai D-00 Start Here"
      lesson_label: "Bio grup"
      lesson_alt: "Bio grup D-04 First App: langkah membuat aplikasi pertama dengan Claude Code"
      tracks_title: "Empat jalur, pilih sesuai kebutuhan"
      tracks:
        - code: D
          name: "Development"
          text: "Bikin aplikasi. 14 grup berurutan, dari nol sampai aplikasinya online dan terpantau."
        - code: V
          name: "Video Production"
          text: "Bikin video dengan Agen AI."
        - code: M
          name: "Marketing"
          text: "Agen AI untuk kerja pemasaran."
        - code: P
          name: "Paper Works"
          text: "Dokumen dan kerjaan kantor."
      start_label: "Mulai dari grup"
      general_html: "Ada juga grup umum: <strong>Ngobrol</strong> untuk diskusi bebas, <strong>Member Showcase</strong> untuk karya anggota, dan <strong>Kopdar</strong> untuk info &amp; dokumentasi pertemuan. Boleh jualan, tapi lewat fitur <strong>Member Tag</strong>: makin aktif &amp; kontributif, makin lancar jualan di komunitas ini."
    meetup_title: "Meetup online berikutnya"
    meetup_more: "Lihat semua acara"
    invite_alt: "Undangan grup WhatsApp Agentic Indonesia"
    invite_caption: "Klik gambar untuk gabung ke grup WhatsApp"
  problem:
    eyebrow: "Terasa familiar?"
    title_html: 'Bhinneka Tunggal Ika<br>(Dalam Penderitaan)'
    personas:
      - role: "Pemilik bisnis"
        icon: "briefcase"
        pains: ["Pesaing baru", "Penjualan lesu", "Hutang supplier numpuk", "Gaji karyawan terancam"]
        wins: ["Bisa scan internet, cari calon customer", "Bisa ekspansi dengan sukses"]
      - role: "Karyawan"
        icon: "users"
        pains: ["Takut di-PHK", "Rekan yang lebih muda dan gaji lebih kecil, tapi bekerja lebih cepat", "Bingung cari pemasukan tambahan"]
        wins: ["Beres lebih banyak dengan kualitas yang lebih bagus", "Pulang langsung bisnis sampingan", "Bantu ajarkan superpower-nya ke teman & keluarga (sering dibayar padahal ga minta)"]
      - role: "Pencari kerja"
        icon: "search"
        pains: ["Persaingan ketat", "Mencari pembeda", "Ingin rintis bisnis, jaga-jaga kalau ga akan dapat kerja"]
        wins: ["CV lebih bagus", "Apply lebih banyak", "Ngonten produktif sambil bisnis sampingan", "Bantu ajarkan superpower-nya ke teman & keluarga (sering dibayar padahal ga minta)"]
    point_lead: "Seperti Nabi Sulaiman yang memakai Jin untuk memukau Ratu Bilqis (Sheba),"
    point: "kamu butuh super power baru. Jauh sebelum pesaingmu menguasainya."
    answer_intro: "Kekuatan super yang kamu butuhkan bukan memindahkan singgasana Ratu Bilqis (Sheba) dalam sekejap mata. Melainkan:"
    answer_points:
      - "Membantu dan mengevaluasi implementasi rencana kamu seperti konsultannya CEO terkenal"
      - "Menyisir dan menganalisa secara rasional ribuan data dalam hitungan menit, sehingga dapat keputusan terbaik — yang belum terbayang oleh kompetitor kamu"
      - "Mengambil-alih pekerjaan kamu dengan lebih baik, lebih cerdas, dan lebih kreatif, sehingga kamu punya waktu untuk mengerjakan hal lain"
    scene:
      tagline_lead: "Nabi Sulaiman punya Jin."
      tagline_html: 'Saya punya <span class="cc-grad">Agent</span>.'
      alt: "Lukisan Nabi Sulaiman berdiri di tangga singgasana berhiaskan singa emas, menyambut Ratu Bilqis (Sheba)"
      credit: "Edward Poynter, The Visit of the Queen of Sheba to King Solomon (1890). Art Gallery of New South Wales. Domain publik, via"
      source_label: "Wikimedia Commons"
    bridge: "Apa buktinya?"
  why:
    title: "Kenapa Agen AI akan mengubah cara kita bekerja"
    intro: "Butuh bikin video, laporan, analisa, atau aplikasi? Selama ini pilihannya cuma dua."
    paths:
      - label: "Pilihan 1"
        title: "Belajar sendiri bertahun-tahun"
        text: "Editing, coding, olah data: lama, dan tidak semua orang punya waktunya."
      - label: "Pilihan 2"
        title: "Bayar ahlinya, lalu menunggu"
        text: "Mahal, dan sering antre berminggu-minggu."
      - label: "Pilihan 3 · Baru"
        title: "Jelaskan, lalu Agen AI yang mengerjakan"
        text: "Anda fokus pada masalahnya. AI yang mengerjakan."
    what_title: "Apa itu Agen AI?"
    what_text: "Agen AI adalah AI yang bekerja langsung di komputer Anda secara mandiri. Anda cukup menjelaskan apa yang Anda mau dalam bahasa sehari-hari. Bahasa Indonesia juga bisa."
    loop:
      - "Anda menjelaskan tujuannya"
      - "AI membuat file, menulis kode, mengolah data"
      - "AI menjalankan dan mengecek hasilnya"
      - "Anda menilai dan memberi masukan"
    loop_note: "Sebelum melakukan hal penting, AI-nya minta izin dulu."
    vs_title: "Bedanya dengan Chat AI"
    chat_label: "Chat AI biasa (lebih butuh skill prompting)"
    chat_user: "Bagaimana cara membuat landing page?"
    chat_bot: "Ini contoh kodenya, silakan disalin:"
    chat_after: "Anda yang menyalin, mencoba, dan memperbaiki kalau error."
    cc_label: "AI Agentic"
    cc_user: "Buatkan landing page untuk toko kue saya."
    cc_steps:
      - "Membuat file"
      - "Menjalankan di browser"
      - "Memperbaiki error-nya sendiri"
    cc_after: "Anda tinggal menilai hasilnya."
    tools_label: "Contohnya"
    tools_hint: "Arahkan kursor atau ketuk salah satu untuk melihat siapa yang membuatnya."
    tools_chat:
      - {name: "ChatGPT", pair: "openai"}
      - {name: "Claude Web", pair: "anthropic"}
      - {name: "Gemini", pair: "google"}
    tools_agent:
      - {name: "Codex", pair: "openai"}
      - {name: "Claude Desktop", pair: "anthropic"}
      - {name: "Antigravity", pair: "google"}
      - {name: "Hermes", pair: "nous"}
    tools_pairs:
      openai: {company: "OpenAI", from: "ChatGPT", to: "Codex", text: "Satu perusahaan, dua cara pakai: ChatGPT untuk ngobrol, Codex untuk mengerjakan."}
      anthropic: {company: "Anthropic", from: "Claude Web", to: "Claude Desktop", text: "Satu perusahaan, dua cara pakai: Claude Web untuk ngobrol, Claude Desktop untuk mengerjakan."}
      google: {company: "Google", from: "Gemini", to: "Antigravity", text: "Satu perusahaan, dua cara pakai: Gemini untuk ngobrol, Antigravity untuk mengerjakan."}
      nous: {company: "Nous Research", from: "Hermes", text: "Hermes dibuat oleh Nous Research, lab AI independen."}
    tools_made_by: "Buatan"
    analogy_html: "Chat AI itu seperti <strong>konsultan di telepon</strong>: sarannya bagus, tapi Anda sendiri yang turun tangan. Agen AI seperti <strong>tukang yang datang ke rumah</strong> membawa perkakas."
    bridge: "Tempat terbaik belajar Agen AI?"
    roles_title: "Siapa pun Anda, ada pekerjaan yang bisa diambil alih Agen AI"
    roles_intro: "Kalau hasilnya digital, kemungkinan besar Agen AI bisa membantu membuatnya. Beberapa contoh:"
    roles:
      - icon: store
        title: "Pemilik toko"
        text: "Katalog produk, foto promo, dan toko online sendiri. Membalas pertanyaan pelanggan yang itu-itu saja."
      - icon: chart
        title: "Marketer"
        text: "Membedah ratusan iklan, menulis variasi baru, dan menyusun laporan kampanye tiap Senin pagi."
      - icon: film
        title: "Kreator konten"
        text: "Memotong video panjang jadi klip pendek lengkap dengan teks, musik, dan thumbnail."
      - icon: school
        title: "Guru"
        text: "Materi ajar, kuis interaktif, animasi penjelasan, dan rekap nilai satu kelas."
      - icon: home
        title: "Orang tua"
        text: "Game belajar yang pas untuk anaknya sendiri, seperti Kebun Makna."
      - icon: file
        title: "Konsultan"
        text: "Riset pasar, laporan, proposal, dan slide klien dari catatan rapat yang berantakan."
      - icon: users
        title: "HR & rekruter"
        text: "Menyaring ratusan CV dengan kriteria yang jelas, menyusun soal tes, dan materi onboarding."
      - icon: search
        title: "Peneliti & mahasiswa"
        text: "Merangkum puluhan jurnal, mengolah data survei, dan membuat grafik siap sidang."
      - icon: briefcase
        title: "Keuangan & admin"
        text: "Mencocokkan spreadsheet, menemukan selisih angka, dan membuat laporan bulanan otomatis."
      - icon: book
        title: "Penulis"
        text: "Ebook siap cetak, cek konsistensi naskah, dan landing page untuk bukunya."
      - icon: shield
        title: "Legal"
        text: "Membandingkan versi kontrak dan menandai klausul yang perlu dibaca ulang oleh manusia."
      - icon: terminal
        title: "Developer"
        text: "Menulis, mengetes, dan memperbaiki kode, bahkan di proyek yang belum pernah dilihat AI-nya."
    roles_outro_html: "Ingin Indonesia maju + dapat uang tambahan? <strong>Bantu mereka semua di atas pakai AI</strong> agar lebih efektif &amp; efisien."
  # Proof 2, appended to the "why" section: an animated case study. The stage
  # data is an illustration; the numbers in the copy come from the source.
  adcase:
    eyebrow: "Bukti 2 · Tim marketing Anthropic"
    title: "Ratusan variasi iklan baru dalam hitungan menit, bukan jam"
    intro_html: "Tim growth marketing Anthropic, pembuat Claude Code, bukan tim programmer. Mereka memakai Claude Code untuk pekerjaan yang dulu memakan waktu berjam-jam: membedah performa iklan dan menulis ulang yang lemah."
    steps:
      - "Membaca file CSV berisi ratusan iklan beserta performanya"
      - "Menandai iklan yang performanya lemah"
      - "Dua sub-agen menulis variasi baru, tetap di dalam batas karakter"
      - "Plugin Figma buatannya mencetak hingga 100 variasi desain, setengah detik per batch"
    source_label: "Sumber: claude.com"
    source_url: "https://claude.com/blog/how-anthropic-teams-use-claude-code"
