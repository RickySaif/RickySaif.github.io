  story1:
    eyebrow: "Bukti 1 · Game belajar Al-Qur'an"
    title: "Nurul Bahirah membuat versi pertama game belajar Al-Qur'an dalam 2&nbsp;jam"
    name: "Nurul Bahirah"
    role: "Konsultan pendidikan, lulusan Inggris"
    photo_alt: "Foto Nurul Bahirah"
    intro_html: "Nurul adalah konsultan pendidikan lulusan Inggris yang ingin mengajarkan makna Al-Qur'an ke anaknya. Dengan Agen AI (merek Claude Code), ia membuat <strong>Kebun Makna</strong>: game berkebun gratis untuk anak-anak belajar arti kata demi kata dan bacaan surat-surat pendek Juz 30. Versi pertamanya jadi dalam <strong>2 jam</strong>."
    features:
      - icon: book
        title: "10 surat, An-Nas sampai Al-Fil"
        text: "Setiap kata punya arti dan audio bacaannya sendiri."
      - icon: mic
        title: "Bacaan diperiksa di HP"
        text: "Anak membaca ayat dengan suaranya sendiri, lalu game memeriksanya."
      - icon: spark
        title: "Belajar sambil bermain"
        text: "Anak menolong warga desa dan mendapat Koin Makna setiap kali memahami arti ayat."
    stats:
