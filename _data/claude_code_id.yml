        title: "A step-by-step tutorial"
        text: "One step, one group. Start from zero and follow the order."
      - icon: chat
        title: "Ask in the right place"
        text: "Stuck on a step? Ask in that step's group. Anyone can answer."
      - icon: pin
        title: "Weekly online meetups"
        text: "Meet online, ask anything, and watch a live demo."
    course:
      title: "One step, one group, guided at your own pace"
      intro: "The tutorial is split across groups, in order. Each group has its instructions in the group bio: the step to follow. Questions about a step stay in that step's group, so they don't get lost in other chat. The lessons are written in Indonesian."
