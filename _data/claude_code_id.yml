        title: "Belajar coding bertahun-tahun"
        text: "Lama, dan tidak semua orang punya waktunya."
      - label: "Pilihan 2"
        title: "Bayar developer, lalu menunggu"
        text: "Mahal, dan sering antre berminggu-minggu."
      - label: "Pilihan 3 · Baru"
        title: "Jelaskan, lalu Claude Code yang mengerjakan"
        text: "Anda fokus pada masalahnya. Ia yang menulis kodenya."
