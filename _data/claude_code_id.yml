      - icon: spark
        title: "Explainer"
        text: "Penjelasan visual yang mudah dipahami"
      - icon: file
        title: "PDF & ebook"
        text: "Laporan, proposal, ebook siap cetak"
      - icon: slides
        title: "Slide presentasi"
        text: "Deck rapi dari catatan Anda"
      - icon: chart
        title: "Data & laporan"
        text: "Merapikan spreadsheet, membuat grafik"
      - icon: image
        title: "Infografis & poster"
        text: "Visual untuk media sosial dan cetak"
      - icon: globe
        title: "Website & aplikasi"
