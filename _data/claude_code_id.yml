        text: "Tim growth marketing Anthropic, pembuat Claude Code, memakai Claude Code untuk membaca data ratusan iklan, menemukan yang kurang berhasil, lalu menulis variasi baru. Hasilnya: ratusan iklan baru dalam hitungan menit, bukan jam."
        links:
          - label: "claude.com"
            url: "https://claude.com/blog/how-anthropic-teams-use-claude-code"
      - tag: "Video animasi · Remotion"
        title: "Dari prompt jadi video animasi"
        text: "Remotion, alat untuk membuat video dengan kode, merilis skills resmi untuk agen AI seperti Claude Code. Agen bisa menyusun animasinya, lalu me-render videonya."
