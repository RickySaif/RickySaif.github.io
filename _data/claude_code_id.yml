        value_html: "Nurul Bahirah, dengan Agen AI (merek Claude Code)"
      - label: "Versi pertama"
        value_html: "2 jam"
      - label: "Model bisnis"
        value_html: "Gratis buat semua. Donasi jika suka."
    badge: "Versi pertama: 2 jam"
    # Before/after card. Bars are person-hours to scale: 2 h against roughly
    # 5 people x 5 months x 160 h = 4,000 h, so the AI bar is a sliver.
    compare:
      title: "Kalau dibuat dengan cara lama"
