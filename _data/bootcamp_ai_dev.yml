id:
  meta_note: "Brief penyelenggara · internal · tidak diindeks"
  switch:
    text: "Ini Opsi A: villa, menginap satu malam."
    link: "Lihat Opsi B: hotel bintang 3–4, tanpa menginap"
    url: "/b/"
  hero:
    badge: "Padepokan Agile × Ricky Saif · brief penyelenggara · Opsi A"
    title_html: 'Rilis <span class="cc-grad">produk nyata</span> dalam dua hari, lalu buat perusahaan Anda ikut memakainya.'
    lead: "AI-Powered Development Bootcamp: dua hari satu malam di sebuah villa di luar Jakarta. Tim membangun software production untuk masalah nyata, mengujinya ke pengguna nyata, dan pulang membawa rencana 90 hari untuk mendorong adopsi di kantor."
    cta_primary: "Lihat rundown"
    cta_secondary: "Lihat angka"
    glance_title: "Sekilas"
    glance:
      - label: "Format"
        value: "2 hari 1 malam, menginap di villa. Praktik mulai 08.00, laptop ditutup 20.00."
      - label: "Usulan tanggal"
        value: "Kamis–Jumat, 17–18 Desember 2026 (tarif hari kerja, masih bisa dibayar dari anggaran L&D tahun ini)"
      - label: "Peserta"
        value: "12 orang · 3 tim isi 4 · 2 coach"
      - label: "Tempat"
        value: "Villa di Bogor (Cisarua atau Sentul), 1–2 jam dari Jakarta"
      - label: "Harga (usulan)"
        value: "Rp 6.000.000 · early bird Rp 5.000.000"
    chip: "Aplikasi production + rencana adopsi"

  why:
    eyebrow: "Kenapa bootcamp ini"
    title: "AI membuat kita membangun produk sepuluh kali lebih cepat. Tapi pengguna dan perusahaan tidak ikut secepat itu."
    intro: "Kebanyakan pelatihan AI berhenti di demo mainan. Kebanyakan hackathon berakhir dengan prototipe yang tidak disentuh lagi hari Senin. Hambatannya sudah bergeser, dari menulis kode ke mengetahui apa yang perlu dibangun dan membuat orang mau memakainya. Bootcamp ini melatih ketiganya."
    source_html: 'Gagasan ini berasal dari <a href="https://rizkysyaiful.github.io/scrum-ai-addendum/" target="_blank" rel="noopener">Scrum Addendum for the AI Era</a>: pembuatnya makin cepat, penggunanya tidak.'
    paths:
      - label: "Workshop AI biasa"
        title: "Demo mainan"
        text: "Aplikasi to-do di laptop trainer. Hari Senin tidak ada yang bisa ditunjukkan ke atasan."
      - label: "Hackathon biasa"
        title: "Begadang, tanpa pengguna"
        text: "Prototipe semalam untuk juri, bukan untuk pelanggan, lalu ditinggalkan seminggu kemudian."
      - label: "Bootcamp ini"
        title: "Produk live, pengguna nyata, rencana rollout"
        text: "Aplikasi production yang sudah dicoba pengguna nyata, plus rencana 90 hari untuk menyebarkan cara kerja ini di perusahaan. Plus tidur delapan jam."

  pillars:
    eyebrow: "Tiga pilar"
    title: "Membangun dengan benar, membangun hal yang tepat, dan memastikannya dipakai"
    intro: "Setiap pilar punya sesi praktisi, blok praktik, dan hasil kerja yang konkret. Sekitar 70% waktu untuk praktik."
    list:
      - code: "A"
        icon: terminal
        name: "Agentic engineering"
        share: "~55% waktu"
        text: "Jalur lengkap dari folder kosong sampai aplikasi production yang terpantau, mengikuti kurikulum komunitas (D-00 sampai D-13), dipadatkan menjadi dua hari."
      - code: "B"
        icon: mic
        name: "Customer research"
        share: "~20% waktu"
        text: "Temukan masalah yang layak diselesaikan, wawancarai pengguna nyata, dan baca sinyal setelah rilis. AI bisa menyusun pertanyaan, tapi tidak bisa menggantikan calon pembeli yang bisa ditanya."
      - code: "C"
        icon: users
        name: "Strategi adopsi"
        share: "~25% waktu"
        text: "Ubah keberhasilan satu tim jadi kebiasaan perusahaan: pemilik, batasan, pilot, metrik, dan pitch ke pimpinan."

  material:
    eyebrow: "Materi"
    title: "Dua belas modul, masing-masing menghasilkan sesuatu yang nyata"
    intro: "Setiap modul diawali paparan singkat (15–25 menit) lalu langsung membangun. Coach mengecek kolom hasil kerja sebelum tim lanjut."
    head_module: "Modul"
    head_learn: "Yang dipelajari"
    head_artifact: "Hasil kerja"
    head_when: "Kapan"
    modules:
      - code: "A0"
        pillar: "A"
        name: "Setup & CLAUDE.md"
        learn: "Akun Claude Code, Git, GitHub, Supabase, dan Vercel siap; CLAUDE.md yang menjelaskan cara kerja proyek ke agen."
        artifact: "Repo berisi CLAUDE.md"
        when: "Prework (online)"
      - code: "B1"
        pillar: "B"
        name: "Masalah dulu"
        learn: "Pilih satu masalah bisnis teratas. Tentukan sinyal awal (apa yang berubah dari perilaku pengguna) dan angka akhir (biaya atau pendapatan)."
        artifact: "Brief masalah satu halaman"
        when: "Hari 1 · 09.45"
      - code: "B2"
        pillar: "B"
        name: "Wawancara yang jujur"
        learn: "Tanyakan perilaku di masa lalu, bukan pendapat. Setiap tim mewawancarai 3 pengguna nyata; sebagian boleh sesama peserta."
        artifact: "3 catatan wawancara + 3 temuan utama"
        when: "Hari 1 · 10.45"
      - code: "A1"
        pillar: "A"
        name: "Plan mode & irisan vertikal"
        learn: "Rencana dulu, baru kode; pecah berdasarkan masalah pengguna, bukan lapisan teknis. Setiap irisan cukup kecil untuk dirilis dalam 90 menit."
        artifact: "Rencana disetujui + daftar irisan"
        when: "Hari 1 · 13.00"
      - code: "A2"
        pillar: "A"
        name: "Alur Git bersama agen"
        learn: "Branch, commit kecil, pull request ditulis agen dan direview manusia."
        artifact: "PR pertama di-merge"
        when: "Hari 1 · 13.30"
      - code: "A3"
        pillar: "A"
        name: "Data, login & deploy"
        learn: "Tabel Supabase dengan row-level security, login Google, deploy ke URL publik."
        artifact: "Irisan 1 live di URL publik"
        when: "Hari 1 · 15.15"
      - code: "B3"
        pillar: "B"
        name: "Serahkan ke pengguna"
        learn: "Kirim link ke pengguna yang diwawancarai pagi tadi; kumpulkan reaksi semalaman."
        artifact: "Log masukan"
        when: "Hari 1 · 17.30"
      - code: "A4"
        pillar: "A"
        name: "Menjaga kualitas di kecepatan AI"
        learn: "Tes end-to-end, cek otomatis di CI, berburu bug, agen kedua mereview kode."
        artifact: "Tes E2E lolos di CI"
        when: "Hari 2 · 07.45"
      - code: "A5"
        pillar: "A"
        name: "Menjalankan di production"
        learn: "Analytics, pemantauan error, secrets, batas maksimal untuk biaya dan data."
        artifact: "Dashboard + alert"
        when: "Hari 2 · 09.30"
      - code: "C1"
        pillar: "C"
        name: "Kenapa adopsi AI macet"
        learn: "Product Owner jadi antrean, fitur menumpuk tanpa dites, biaya naik seiring kecepatan. Cara menentukan siapa pemilik yang sebenarnya dan siapa boleh memutuskan apa."
        artifact: "Peta pemangku kepentingan"
        when: "Hari 2 · 13.00"
      - code: "C2"
        pillar: "C"
        name: "Rencana adopsi 90 hari"
        learn: "Tim pilot, metrik keberhasilan, batasan (data, keamanan, anggaran), dan jalur belajar untuk rekan kerja."
        artifact: "Kanvas adopsi"
        when: "Hari 2 · 14.00"
      - code: "C3"
        pillar: "C"
        name: "Pitch ke pimpinan"
        learn: "Mulai dari hasil bisnis: masalah, sinyal, angka, dan biaya kalau diperluas."
        artifact: "Demo + pitch 7 menit"
        when: "Hari 2 · 15.20"

