      - "Pajak penghasilan: kalau PT memenuhi syarat PPh final UMKM (omzet di bawah Rp 4,8 miliar setahun), PT membayar 0,5% dari pendapatan kotor, untung atau tidak. Kalau tidak, PPh badan 22% dari laba, efektif 11% dengan fasilitas Pasal 31E. Keduanya ada di kalkulator."
      - "PPN: hanya kalau PT sudah PKP. Tawarkan harga korporat \"belum termasuk PPN\" lalu tambahkan 11% di invoice; PPN jadi titipan dan PPN hotel bisa dikreditkan. Kalau harga harus sudah termasuk PPN, tiket Rp 8,5 juta bersihnya hanya sekitar Rp 7,66 juta."
      - "PPh 23: klien korporat bisa memotong 2% saat membayar PT. Ini pembayaran pajak di muka, bukan biaya, tapi uangnya baru kembali saat SPT tahunan."
      - "PPh 21: PT wajib memotong pajak atas pembayaran ke perorangan. Untuk pembicara pembuka dan coach, estimasi ini memakai gross-up; bagian laba pembicara dipotong PPh 21 dari bagiannya sendiri."
