      - "PPh 21: PT wajib memotong pajak atas pembayaran ke perorangan. Untuk pembicara pembuka, pembicara tamu, dan fasilitator utama, estimasi ini memakai gross-up; bagian laba pembicara dipotong PPh 21 dari bagiannya sendiri."
