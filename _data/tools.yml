# Free tools, newest last. Rendered by /tools/ in both languages.
# Add a tool: append one entry. `repo` empty -> links to site.github_url.
# `case` is the slug of its case study in _cases/ (optional).
# `page` is an on-site page with more detail (optional).
# `banner` (+ `banner_alt`) is the wide image shown on top of the card, taken from the repo README.
# `flagship: true` puts the tool in the top block on the home page (three max).
# `range` is the potential impact, shown on the card, e.g. "Rp 50-200 jt / year".
#   A plain string, or en:/id: when the wording differs per language.
#   Leave it empty to show only the label. Never put a number here you cannot defend.
# `problem` is the one-paragraph current problem shown on the card.
- name: "BugHunterr"
  lever: cost
  flagship: true
  banner: "/assets/images/tools/bughunterr-banner.webp"
  banner_alt:
    en: "BugHunterr: a friendly tuyul ghost catches a red bug with a magnifying glass over a browser window."
    id: "BugHunterr: tuyul ramah menangkap bug merah dengan kaca pembesar di atas jendela browser."
  workshop_url: "#"
  range:
    en: "From one QA engineer's salary to your company's value"
    id: "Dari gaji satu QA engineer sampai nilai perusahaan Anda"
  problem:
    en: "AI-powered hackers find the holes before your team does. One high-severity bug can cost real money. And vibe-coded apps turn into spaghetti code nobody dares to touch."
    id: "Hacker yang dibantu AI menemukan celah lebih dulu dari tim Anda. Satu bug berat bisa berarti kerugian finansial nyata. Dan aplikasi hasil vibecoding berubah jadi spaghetti code yang tak seorang pun berani menyentuh."
  repo: "https://github.com/RickySaif/BugHunterr"
  summary:
    en: "An AI agent (Claude Code or Codex) hunts bugs in your web app with a real browser, the code and the database. Every bug comes with a video, a regression test and a fix prompt."
    id: "Agen AI (Claude Code atau Codex) memburu bug di aplikasi web Anda lewat browser sungguhan, kode, dan database. Setiap bug disertai video, tes regresi, dan prompt perbaikan."

- name: "Scouterr"
  lever: profit
  flagship: true
  banner: "/assets/images/tools/scouterr-banner.webp"
  banner_alt:
    en: "Scouterr: a scout tuyul ghost peeks through binoculars at people's profiles. Find the right people. You make the call."
    id: "Scouterr: tuyul pramuka mengintip lewat teropong ke profil orang. Temukan orang yang tepat. Anda yang memutuskan."
  range: ""
  problem:
    en: "The right buyers and the right hires are already out there in public posts and profiles. Finding them by hand takes days, and bulk outreach gets you ignored or blocked."
    id: "Pembeli dan kandidat yang tepat sebenarnya sudah ada di postingan dan profil publik. Mencarinya manual makan berhari-hari, dan pesan massal membuat Anda diabaikan atau diblokir."
  repo: "https://github.com/RickySaif/scouterr"
  summary:
    en: "Scouterr Leads finds likely buyers in public posts and prepares a gradual approach. Scouterr Talent finds and ranks people worth hiring. A person approves every action."
    id: "Scouterr Leads menemukan calon pembeli dari postingan publik dan menyiapkan pendekatan bertahap. Scouterr Talent menemukan dan meranking kandidat yang layak direkrut. Setiap aksi harus disetujui manusia."

- name: "Competitor-to-test-site kit"
  lever: profit
  range: ""
  problem:
    en: "A competitor's new offer seems to work. Testing the same idea means six weeks and a quote you must defend to the board, and by then the window has closed."
    id: "Penawaran baru kompetitor Anda sepertinya laku. Menguji ide yang sama butuh enam minggu, plus penawaran harga yang harus Anda pertanggungjawabkan di depan direksi. Saat semuanya selesai, momennya sudah lewat."
  case: competitor-site
  repo: ""
  summary:
    en: "Playwright plus AI: study a proven competitor page and rebuild your own version to test demand."
    id: "Playwright dan AI: pelajari halaman kompetitor yang sudah terbukti laku, lalu bangun versi Anda sendiri untuk menguji minat pasar."

- name: "Bug reproduction and fix assistant"
  lever: cost
  range: ""
  problem:
    en: "Checkout is broken, the vendor wants screenshots, and two weeks later the ticket is still open while the invoice counts the hours."
    id: "Checkout rusak, vendor minta tangkapan layar, dan dua minggu kemudian tiketnya masih terbuka sementara tagihan per jamnya terus berjalan."
  case: bug-reproduction
  repo: ""
  summary:
    en: "Turn a vague bug report into exact steps, a proposed fix and a verified result."
    id: "Ubah laporan bug yang samar menjadi langkah pasti, usulan perbaikan, dan hasil yang terverifikasi."

- name: "Requirement specification writer"
  lever: cost
  range: ""
  problem:
    en: "You explained what you wanted, the vendor nodded, and three months later you got something else. Every fix is now a paid change request."
    id: "Anda sudah menjelaskan apa yang Anda mau, vendor mengangguk, dan tiga bulan kemudian yang datang berbeda. Setiap perbaikan kini jadi change request berbayar."
  case: requirement-specification
  repo: ""
  summary:
    en: "Turn notes, chats and voice memos into one spec, with the open questions listed."
    id: "Ubah catatan, chat, dan rekaman suara menjadi satu spesifikasi, lengkap dengan daftar pertanyaan terbuka."

- name: "Gap analysis assistant"
  lever: profit
  range: ""
  problem:
    en: "Sales are flat, or a competitor is winning deals you used to win. \"Something is missing\" is not a plan."
    id: "Penjualan stagnan, atau kompetitor memenangkan deal yang dulu Anda menangkan. \"Ada yang kurang\" bukan rencana."
  case: gap-analysis
  repo: ""
  summary:
    en: "Compare where you are with where you need to be, and rank the gaps by impact."
    id: "Bandingkan posisi Anda dengan target, lalu urutkan kesenjangannya berdasarkan dampak."

- name: "My Self, Inc"
  lever: profit
  range: ""
  problem:
    en: "Big decisions are made alone, and nobody around you is paid to say where the plan is weak."
    id: "Keputusan besar diambil sendirian, dan tidak ada orang di sekitar Anda yang dibayar untuk menunjukkan titik lemah rencananya."
  page: /my-self-inc/
  repo: "https://github.com/RickySaif/my-self-inc"
  summary:
    en: "Six AI advisors, one per seat on your inner board, that stress-test a decision before you put your name on it."
    id: "Enam penasihat AI, satu untuk setiap kursi di dewan batin Anda, yang menguji keputusan Anda sebelum benar-benar diambil."
