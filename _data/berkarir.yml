# Words for /berkarir/ (template: _includes/berkarir.html).
# One block per language; both blocks have the same keys. Values ending in
# _html may contain markup. Placeholders are written as
# <mark class="bk-ph">[ISI: ...]</mark>; search for "[ISI" (id) or "[FILL" (en) to find them all.
# Draft proposal: the page is noindex until the placeholders are filled.

id:
  hero:
    badge: "Proposal · Draf untuk pemilik bisnis"
    title_html: 'Berkarir di Era <span class="cc-grad">Problem Solving</span>'
    hook: "“Jika pekerjaan di laptop diambil alih AI, pegawai saya mengerjakan apa?”"
    hook_who: "Pertanyaan yang makin sering kami dengar dari pemilik bisnis yang menggaji programmer."
    cta_wa: "Ngobrol dulu lewat WhatsApp"
    cta_paths: "Lihat dua jalannya"

  chain:
    title: "pekerjaan digital · yang mulai diambil alih AI"
    note: "Ringkasan"
    steps:
      - name: "Konsultasi & riset"
        kind: evidence
        tag: "Sudah terjadi"
        text: "Riset, ringkasan, analisa data, dan draf laporan kini dikerjakan AI dalam hitungan menit."
      - name: "Coding"
        kind: evidence
        tag: "Sedang terjadi"
        text: "Lowongan programmer junior turun; satu orang dengan AI menyelesaikan yang dulu butuh tim."
      - name: "Video editing"
        kind: early
        tag: "Mulai terjadi"
        text: "Memotong, memberi teks, dan me-render video sudah bisa diminta dalam satu kalimat."
      - name: "???"
        kind: open
        tag: "Belum tahu"
        text: "Kami tidak tahu apa berikutnya. Itu justru intinya."
    foot_html: 'Dua langkah pertama punya bukti; langkah ketiga baru tanda-tanda awal. Lihat <a href="#sumber">sumber</a>.'

  problem:
    eyebrow: "Terasa familiar?"
    title_html: "Semua orang di kantor<br>sedang khawatir hal yang sama"
    personas:
      - role: "Pemilik bisnis"
        icon: briefcase
        pains: ["Gaji tim IT jalan terus, hasilnya terasa makin bisa dikejar AI", "PHK mahal, dan rasanya tidak adil untuk orang yang sudah lama setia", "Tidak tahu harus melatih tim ke arah mana"]
      - role: "Programmer"
        icon: terminal
        pains: ["Takut posisinya hilang", "Junior yang pakai AI lebih cepat", "Jarang ketemu pengguna, jadi tidak tahu masalah aslinya", "Grogi kalau harus presentasi atau wawancara user"]
      - role: "Manajer & tim lain"
        icon: users
        pains: ["Permintaan ke tim IT antre berminggu-minggu", "Yang dibangun sering tidak sesuai kebutuhan", "Kalau ada yang keluar, pengetahuan sistem ikut hilang"]
    point_lead: "Faktanya: AI terus mengambil alih pekerjaan digital."
    point: "Kalau tidak ada yang berubah, gaji yang Anda bayar akan makin kurang efektif dari tahun ke tahun."
    evidence_intro: "Yang sudah ada buktinya, dan yang masih perkiraan:"
    evidence:
      - "Bukti: di Amerika Serikat, pekerja usia 22–25 tahun di profesi yang paling terpapar AI (termasuk developer) 19% di bawah tren rekan mereka yang kurang terpapar. Penyebabnya: rekrutmen baru yang berkurang, bukan PHK (Stanford, revisi Agustus 2026)."
      - "Bukti: lowongan developer di AS naik lagi sejak 2025, tapi kenaikannya didominasi posisi senior, dan masih jauh di bawah tahun 2020 (Indeed Hiring Lab, Juli 2026)."
      - "Bukti yang berlawanan: dalam satu uji terkontrol, developer berpengalaman justru 19% lebih lambat saat memakai AI di kode yang sudah mereka kenal (METR, 2025)."
      - "Prediksi, bukan bukti: AI akan terus naik ke pekerjaan berikutnya. Seberapa cepat, tidak ada yang tahu pasti."
    evidence_note_html: 'Data khusus Indonesia masih tipis. Kami belum menemukan angka resmi soal dampak AI pada lowongan programmer di Indonesia. Detail di <a href="#sumber">sumber</a>.'
    bridge: "Apakah ada solusi lain selain efisiensi?"

  km:
    eyebrow: "Bukti 1 · Ancamannya nyata"
    title: "Kalau non-coder bisa membuat ini, apa nilai seorang coder?"
    intro_html: 'Nurul Bahirah, konsultan pendidikan yang tidak bisa coding, membuat versi pertama <strong>Kebun Makna</strong> dalam <strong>2 jam</strong> dengan Claude Code: game gratis untuk anak belajar arti kata demi kata surat-surat pendek Juz 30.'
    compare:
      title: "Kalau dibuat dengan cara lama"
      ai_label: "Dengan Claude Code"
      ai_value: "2 jam · 1 orang"
      ai_note: "Nurul sendiri, tanpa bisa coding"
      before_label: "Sebelum ada AI"
      before_value: "4–6 bulan · 5 orang digaji"
      before_note: "Game designer, ilustrator pixel art, dua programmer (satu khusus pengenalan suara), dan penguji"
      caption: "Angka “sebelum ada AI” adalah perkiraan kami untuk game seukuran versi pertama Kebun Makna, bukan hasil pengukuran."
    question: "Jawaban jujurnya: nilainya bergeser, bukan hilang."
    answer:
      - "Nurul tidak memulai dari teknologi. Ia memulai dari hal yang paling ia pahami: cara anak belajar. Keunggulannya adalah pemahaman yang dalam tentang pengguna dan masalahnya. Itu yang biasanya tidak dimiliki programmer."
      - "Tapi Kebun Makna adalah versi pertama untuk satu kebutuhan, bukan sistem produksi yang melayani ribuan transaksi. Begitu sebuah aplikasi menyimpan data pelanggan, menerima pembayaran, atau harus tetap jalan tiga tahun lagi, ada hal yang sering terlewat: keamanan data, keandalan, dan kode yang bisa dirawat. Contohnya nyata: tahun 2025, 170 dari 1.645 aplikasi buatan AI yang dipindai membuka data penggunanya karena satu pengaturan database terlewat, dan dalam uji Veracode, kode buatan AI mengandung celah keamanan umum di 45% tugas."
      - "Jadi nilai programmer bergeser: dari menulis kode, ke memahami masalah dan pengguna, lalu menilai kualitas, keamanan, dan daya tahan solusinya. Celah pertama itulah yang diisi program ini."
    link: "Coba Kebun Makna"
    table_title: "Siapa membawa apa"
    table_head: ["Yang Nurul punya", "Yang biasanya dimiliki programmer", "Yang ditambahkan program ini"]
    table_rows:
      - aspect: "Pengguna & masalah"
        nurul: "Paham betul cara anak belajar"
        dev: "Jarang bertemu pengguna; menerima tiket"
        adds: "Wawancara pengguna sungguhan tiap minggu"
      - aspect: "Membangun"
        nurul: "Claude Code, tanpa latar coding"
        dev: "Bisa coding, sebagian belum terbiasa AI"
        adds: "Claude Code + Supabase + GitHub sebagai alat kerja harian"
      - aspect: "Kualitas & keamanan"
        nurul: "Belum jadi fokus di versi pertama"
        dev: "Tahu cara menguji, mengamankan, dan merawat kode"
        adds: "Dipertahankan, dan dipakai untuk menilai hasil AI"
      - aspect: "Komunikasi"
        nurul: "Terbiasa menjelaskan ke orang tua dan anak"
        dev: "Sering grogi di depan pengguna atau atasan"
        adds: "Latihan bicara gaya Toastmasters tiap minggu"
    footnote_html: 'Catatan jujur: Kebun Makna membuktikan <em>ancamannya</em>, belum membuktikan <em>solusinya</em>. Bukti bahwa programmer bisa bergeser peran: <mark class="bk-ph">[ISI: contoh programmer yang bergeser peran / hasil pilot]</mark>.'

  paths:
    eyebrow: "Dua jalan"
    title: "Ya, ada jalan selain efisiensi"
    intro: "Keduanya masuk akal. Yang satu mengurangi biaya, yang lain mengubah apa yang dibeli dari biaya itu."
    list:
      - label: "Jalan 1"
        icon: briefcase
        title: "Efisiensi: kurangi beban gaji"
        text: "Wajar dipertimbangkan, dan kadang memang perlu. Tapi ada biaya pesangon yang nyata, risiko sengketa, dan pengetahuan sistem yang ikut keluar."
      - label: "Jalan 2"
        icon: spark
        new: true
        title: "Pindahkan orangnya ke problem solving"
        text: "Geser tim dari pekerjaan yang diambil AI, ke menemukan dan menyelesaikan masalah nyata pengguna perusahaan: pekerjaan yang menghasilkan pendapatan."
    note: "Dua jalan ini tidak saling meniadakan. Banyak perusahaan akan memakai keduanya."

  cost:
    eyebrow: "Biaya jalan 1"
    title: "Berapa sebenarnya biaya melepas 5 programmer?"
    intro: "PHK di Indonesia diatur PP 35/2021. Hitungannya pesangon + uang penghargaan masa kerja (UPMK) + uang penggantian hak (UPH), dari upah pokok ditambah tunjangan tetap. Geser angkanya sesuai kondisi Anda."
    table_caption: "Kelipatan upah per orang (PP 35/2021, Pasal 40)"
    head_tenure: "Masa kerja"
    head_pes: "Pesangon"
    head_upmk: "UPMK"
    rows:
      - ["< 1 tahun", "1 bulan", "–"]
      - ["1–2 tahun", "2 bulan", "–"]
      - ["2–3 tahun", "3 bulan", "–"]
      - ["3–6 tahun", "4–6 bulan", "2 bulan"]
      - ["6–9 tahun", "7–9 bulan", "3 bulan"]
      - ["9–12 tahun", "9 bulan", "4 bulan"]
      - ["12–24 tahun", "9 bulan", "5–8 bulan"]
      - ["≥ 24 tahun", "9 bulan", "10 bulan"]
    rules_title: "Yang perlu diperhatikan"
    rules:
      - "Efisiensi karena perusahaan rugi: 0,5× pesangon. Efisiensi untuk mencegah rugi: 1× pesangon. UPMK tetap 1× (Pasal 43)."
      - "Kerugian harus dibuktikan, misalnya lewat audit internal atau eksternal. Tanpa bukti, sengketa di Pengadilan Hubungan Industrial lebih mungkin terjadi."
      - "Mengganti karyawan dengan orang yang lebih murah untuk posisi yang sama sulit disebut efisiensi, karena efisiensi dikaitkan dengan rugi atau mencegah rugi. Risiko sengketanya tinggi. Ini analisa kami, bukan putusan pengadilan."
      - "DPR mengesahkan UU Pelindungan Ketenagakerjaan pada 6 Oktober 2026, menindaklanjuti putusan MK 168/PUU-XXI/2023. Aturan pelaksananya belum kami pastikan. Kelipatan di atas bisa sudah berubah: cek ke konsultan hukum sebelum memakai angka ini."
    calc_title: "Hitung perkiraan Anda"
    calc_n: "Jumlah programmer:"
    calc_wage: "Upah pokok + tunjangan tetap per bulan (contoh, ganti dengan angka Anda)"
    calc_tenure: "Rata-rata masa kerja:"
    calc_years: "tahun"
    calc_reason: "Alasan efisiensi"
    calc_loss: "Karena rugi (0,5×)"
    calc_prevent: "Mencegah rugi (1×)"
    calc_fee: "Biaya program untuk orang yang sama (opsional)"
    calc_fee_ph: "isi jika sudah ada penawaran"
    out_pes: "Pesangon"
    out_upmk: "UPMK"
    out_total: "Perkiraan total (belum termasuk UPH)"
    bar_sev: "Pesangon + UPMK"
    bar_fee: "Biaya program"
    bar_fee_empty: "[ISI: harga program]"
    calc_note: "Perkiraan kasar, bukan nasihat hukum. Belum termasuk UPH (sisa cuti, ongkos pulang), biaya rekrutmen pengganti, dan biaya sengketa. Verifikasi ke konsultan HR atau hukum."
    options_title: "Jalan ketiga yang realistis: tahan rekrutmen + biarkan turnover alami"
    options_intro: "Banyak pemilik akan memilih ini: tidak merekrut pengganti, menunggu yang keluar sendiri, lalu mengisi kebutuhan dengan junior yang fasih AI. Ini pilihan sah. Mari bandingkan dengan jujur."
    options_head: ["Efisiensi (PHK)", "Tahan rekrutmen + turnover", "Program ini"]
    options_rows:
      - aspect: "Biaya langsung"
        a: "Pesangon + UPMK + UPH, dibayar di depan"
        b: "Hampir nol; gaji turun pelan-pelan"
        c: '<mark class="bk-ph">[ISI: harga]</mark> per kohort'
      - aspect: "Kecepatan efek"
        a: "Cepat (bulan ini)"
        b: "Lambat dan tidak bisa diatur siapa yang keluar"
        c: "3 bulan sampai capstone pertama jalan"
      - aspect: "Risiko"
        a: "Sengketa, nama baik sebagai pemberi kerja"
        b: "Yang keluar justru yang paling bagus"
        c: "Sebagian peserta tidak berhasil bergeser"
      - aspect: "Moral tim yang tersisa"
        a: "Turun; semua menunggu giliran"
        b: "Beban kerja naik untuk yang bertahan"
        c: "Ada arah karier yang jelas"
      - aspect: "Pengetahuan sistem"
        a: "Ikut keluar"
        b: "Ikut keluar, pelan-pelan"
        c: "Tetap di dalam, ditambah pemahaman pengguna"
    not_solve: "Yang tidak diselesaikan program ini: jumlah orang. Program ini memperbaiki efektivitas, bukan headcount. Kalau masalah Anda memang terlalu banyak orang untuk bisnis yang ada, program ini bukan jawabannya."
    footnote_html: 'Sumber: <a href="#sumber">PP 35/2021</a>. Tabel di atas disederhanakan; pesangon naik satu bulan untuk tiap tahun masa kerja sampai 9 bulan. Semua angka dalam kalkulator adalah contoh yang bisa Anda ganti.'

  program:
    eyebrow: "Programnya"
    title: "Dua jalur, satu tujuan: masalah pengguna yang beres"
    intro: "Program pengembangan full-remote yang dirancang dan dipandu Ricky Saif. Setiap peserta atau tim kecil (squad) membawa satu masalah nyata yang terkait bisnis utama perusahaan, lalu menyelesaikannya sampai jalan."
    tracks:
      - code: "A"
        name: "Komunikasi"
        text: "Latihan bicara gaya Toastmasters: berani dan lancar menghadapi pengguna. Mendengar, bertanya, menjelaskan, dengan tujuan menyelesaikan masalah mereka."
        steps:
          - code: "A1"
            text: "Bicara 2 menit tanpa persiapan (table topics)"
          - code: "A2"
            text: "Wawancara pengguna: bertanya tanpa menggiring"
          - code: "A3"
            text: "Menjelaskan solusi ke orang non-teknis"
          - code: "A4"
            text: "Evaluasi teman: satu pujian, satu saran"
          - code: "A5"
            text: "Presentasi capstone di depan pemilik"
      - code: "B"
        name: "Build"
        text: "Praktik langsung Claude Code + Supabase + GitHub Pages untuk membangun solusinya. Mengikuti urutan jalur D di komunitas Claude Code Indonesia."
        steps:
          - code: "D-04"
            text: "First App"
          - code: "D-05"
            text: "CLAUDE.md"
          - code: "D-06"
            text: "Git & GitHub"
          - code: "D-07"
            text: "Supabase"
          - code: "D-08"
            text: "Google Login"
          - code: "D-11"
            text: "Publish"
    tm_note: "“Gaya Toastmasters” hanya menggambarkan formatnya. Program ini tidak berafiliasi dengan Toastmasters International."
    week_title: "Ritme mingguan"
    week_text: "Semua online. Dirancang supaya tetap bisa jalan di samping pekerjaan sehari-hari."
    week:
      - "Senin · Sesi Komunikasi 60 menit (Zoom/Meet)"
      - "Selasa–Kamis · Bicara dengan minimal 2 pengguna"
      - "Rabu · Sesi Build 90 menit, live dengan Claude Code"
      - "Jumat · Demo 5 menit per squad + evaluasi"
    week_note: 'Perkiraan waktu peserta: <mark class="bk-ph">[ISI: 4–6 jam/minggu]</mark> termasuk sesi.'
    format:
      - label: "Durasi"
        value_html: '<mark class="bk-ph">[ISI: 12 minggu]</mark>'
      - label: "Ukuran kohort"
        value_html: '<mark class="bk-ph">[ISI: 6–12 orang, squad 2–3]</mark>'
      - label: "Bahasa"
        value_html: '<mark class="bk-ph">[ISI: Indonesia]</mark>'

  capstone:
    eyebrow: "Capstone"
    title: "Capstone adalah buktinya"
    intro: "Bukan ujian tertulis. Setiap squad menemukan masalah nyata, bicara dengan penggunanya, membangun, dan merilis solusi yang dipakai."
    steps:
      - time: "Minggu 1–2"
        title: "Temukan masalahnya"
        text: "Pilih satu masalah yang dekat dengan bisnis utama: yang membuang waktu, uang, atau pelanggan."
      - time: "Minggu 2–4"
        title: "Bicara dengan pengguna"
        text: "Minimal 5 wawancara. Tujuannya memahami, bukan menjual ide."
      - time: "Minggu 4–9"
        title: "Bangun"
        text: "Versi pertama secepatnya, lalu diperbaiki bersama penggunanya."
      - time: "Minggu 9–11"
        title: "Rilis"
        text: "Dipakai orang sungguhan, dan diukur."
      - time: "Minggu 12"
        title: "Presentasi"
        text: "Di depan pemilik: masalahnya, buktinya, hasilnya, dan langkah berikutnya."
    term:
      title: "claude · capstone-retur-pesanan"
      note: "Ilustrasi"
      notes_title: "Catatan wawancara (minggu 3)"
      notes:
        - who: "CS:"
          text: "“Tiap retur saya cek 3 tempat: WA, spreadsheet, dan sistem gudang.”"
        - who: "Gudang:"
          text: "“Saya baru tahu ada retur kalau barangnya sudah datang.”"
        - who: "Pelanggan:"
          text: "“Saya tanya status retur 4 kali, jawabannya beda-beda.”"
      scenes:
        - week: "Minggu 5"
          prompt: "Baca catatan-wawancara.md. Buat halaman status retur: CS input sekali, gudang dan pelanggan bisa lihat statusnya."
          steps:
            - "Membaca 7 catatan wawancara, merangkum 3 kebutuhan"
            - "Membuat tabel retur di Supabase, dengan aturan akses per peran"
            - "Membuat halaman input CS dan halaman cek status"
            - "Selesai. Siap dicoba oleh 2 CS besok pagi."
        - week: "Minggu 8"
          prompt: "Tambahkan notifikasi ke gudang saat retur disetujui, lalu publish."
          steps:
            - "Menambah notifikasi, mengetes dengan data contoh"
            - "Mengecek: tidak ada data pelanggan yang terbuka untuk publik"
            - "Selesai. Online, dipakai tim CS mulai Senin."
    examples_title: "Contoh capstone untuk tiga jenis bisnis"
    examples_intro: "Contoh rekaan untuk menggambarkan bentuknya, bukan klien sungguhan."
    ex_problem: "Masalah"
    ex_users: "Bicara dengan"
    ex_build: "Yang dibangun"
    ex_measure: "Diukur dari"
    examples:
      - icon: store
        biz: "Distributor / grosir"
        problem: "Sales keliling tidak tahu stok terbaru, pesanan sering batal."
        users: "Sales lapangan, admin gudang, 3 toko pelanggan"
        build: "Halaman cek stok di HP + form pesanan yang langsung masuk ke gudang"
        measure: "Pesanan batal karena stok, sebelum vs sesudah"
      - icon: heart
        biz: "Klinik"
        problem: "Pasien menunggu lama karena antrean dicatat manual."
        users: "Resepsionis, dokter, 10 pasien"
        build: "Antrean online sederhana dengan perkiraan jam dipanggil"
        measure: "Rata-rata waktu tunggu, keluhan pasien"
      - icon: phone
        biz: "Perusahaan software (B2B)"
        problem: "Klien baru butuh 3 minggu sampai benar-benar memakai produk."
        users: "Tim onboarding, 5 klien baru"
        build: "Panduan setup interaktif + checklist yang terpantau"
        measure: "Hari sampai klien aktif, tiket bantuan"

  owner:
    eyebrow: "Yang Anda terima"
    title: "Apa yang pemilik dapat di akhir program"
    deliver_title: "Hasil kerja"
    deliverables:
