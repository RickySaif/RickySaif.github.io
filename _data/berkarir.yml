      - name: "CVE-2025-48757: aplikasi Lovable + Supabase tanpa Row Level Security"
        url: "https://www.bleek.dev/cve-2025-48757"
        note: "170 dari 1.645 aplikasi terbuka; cek juga catatan resmi NVD"
      - name: "Veracode (2025), GenAI Code Security Report"
