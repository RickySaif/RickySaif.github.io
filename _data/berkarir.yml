  faq:
    title: "Questions that usually come up"
    list:
      - q: "My programmers don't like talking to people. Will this work?"
        a_html: "Maybe not for everyone, and that's fine. Track A starts with small exercises (a 2-minute talk, interviewing one person) in a safe setting. Most nervousness is about practice, not talent. If after the program someone is still better suited to work behind the scenes, that is useful to know too: their role can be guarding the quality and security of what AI produces."
      - q: "Why not just hire AI-fluent juniors?"
        a_html: "You can, and for some needs it's the right choice. The difference: a new junior doesn't yet know your business, your customers, and your systems. Your existing team does. This program adds AI ways of working and the confidence to meet users to people who already have the context. Compare the costs and risks in the table above."
      - q: "What if they leave after being trained?"
        a_html: "This risk is real. Two things help: the capstone solution stays with the company and is kept in the company's repository, and people with a clear career direction tend to stay longer. If needed, a service-bond agreement can be discussed with your HR, on reasonable terms."
      - q: "Are the capstone results used to assess participants?"
        a_html: "Yes, and that is said openly from day one. This program is a development path; the owner will see the capstone results when deciding on roles. The criteria are written down at the start, focus on the process (interviews, validation, shipping) and not only the final result, and are designed to be achievable through honest effort. The capstone is one input, not the only basis for a decision."
      - q: "What about customer data and company confidentiality?"
        a_html: "Ground rules from the first week: <ol><li>Use sample or anonymized data while building.</li><li>Customers' personal data only comes in after the owner's written approval and a processing basis under the PDP Law.</li><li>Use the company's Claude and Supabase accounts, not personal ones.</li><li>Turn on Row Level Security on every Supabase table; secret keys never go into public code.</li><li>GitHub repositories belong to the company's organization, and are private if they contain business logic.</li><li>The code and capstone results belong to the company, written into the cooperation agreement.</li></ol>This is not legal advice; adapt it to your company's policy."
      - q: "Are GitHub Pages and Supabase enough for production?"
        a_html: "For internal tools, information pages, forms, and small to medium apps: usually yes. For payment systems, highly sensitive data, very high load, or a commercial online store on GitHub Pages: no, and we steer capstones like that toward a prototype, then move it to the company's infrastructure. GitHub Pages is not intended for commercial online businesses."
      - q: "Is this a Toastmasters program?"
        a_html: "No. “Toastmasters-style” only describes the format: prepared speeches, impromptu speaking, and peer evaluation. This program is not affiliated with Toastmasters International."
      - q: "Does this program reduce the number of employees?"
        a_html: "No. This program improves effectiveness, not headcount. If the main problem is having too many people, talk about that honestly first; we can help think it through, but this program is not a layoff tool in disguise."
      - q: "What about non-programmer employees (marketing, admin)?"
        a_html: "The pattern is the same: find a problem, talk to users, build with AI. But Track B is currently designed for developers. For other teams, we suggest starting with a programmer pilot first, then expanding."

