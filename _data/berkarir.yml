      - "Catatan wawancara pengguna dan masalah yang sudah divalidasi"
      - "Presentasi capstone, dengan angka sebelum dan sesudah"
      - "Laporan per peserta: kekuatan, perkembangan, dan saran peran berikutnya"
      - "Aturan kerja aman dengan AI dan data perusahaan"
    score_title: "Scorecard keberhasilan"
    score_head: ["Ukuran", "Cara mengukur", "Target"]
    score:
      - metric: "Percakapan dengan pengguna"
        how: "Catatan wawancara"
