en:
  hero:
    badge: "Proposal · Draft for business owners"
    title_html: 'Careers in the Age of <span class="cc-grad">Problem Solving</span>'
    hook: "“If AI takes over the work done on a laptop, what will my employees do?”"
    hook_who: "A question we hear more and more from business owners who pay programmers."
    cta_wa: "Talk it over on WhatsApp"
    cta_paths: "See the two paths"

  chain:
    title: "digital work · that AI is starting to take over"
    note: "Summary"
    steps:
      - name: "Consulting & research"
        kind: evidence
        tag: "Already happened"
        text: "Research, summaries, data analysis, and report drafts are now done by AI in minutes."
      - name: "Coding"
        kind: evidence
        tag: "Happening now"
        text: "Junior programmer openings are down; one person with AI finishes what used to take a team."
      - name: "Video editing"
        kind: early
        tag: "Starting"
        text: "Cutting, captioning, and rendering a video can already be done with one sentence."
      - name: "???"
        kind: open
        tag: "Unknown"
        text: "We don't know what comes next. That is exactly the point."
    foot_html: 'The first two steps have evidence; the third is only an early sign. See the <a href="#sumber">sources</a>.'

  problem:
    eyebrow: "Sound familiar?"
    title_html: "Everyone in the office<br>is worried about the same thing"
    personas:
      - role: "Business owner"
        icon: briefcase
        pains: ["The IT team's salaries keep running, while their output feels increasingly within AI's reach", "Layoffs are expensive, and feel unfair to people who have been loyal for years", "No idea which direction to train the team in"]
      - role: "Programmer"
        icon: terminal
        pains: ["Afraid of losing their position", "Juniors using AI are faster", "Rarely meet users, so they don't know the real problem", "Nervous about presenting or interviewing users"]
      - role: "Managers & other teams"
        icon: users
        pains: ["Requests to the IT team queue up for weeks", "What gets built often doesn't match what's needed", "When someone leaves, their knowledge of the system leaves too"]
    point_lead: "The fact: AI keeps taking over digital work."
    point: "If nothing changes, the salaries you pay will become less effective year after year."
    evidence_intro: "What has evidence behind it, and what is still a guess:"
    evidence:
      - "Evidence: in the United States, workers aged 22–25 in the professions most exposed to AI (including developers) are 19% below the trend of their less-exposed peers. The cause: fewer new hires, not layoffs (Stanford, revised August 2026)."
      - "Evidence: developer job postings in the US have risen again since 2025, but the increase is dominated by senior positions, and is still well below 2020 (Indeed Hiring Lab, July 2026)."
      - "Evidence to the contrary: in one controlled trial, experienced developers were actually 19% slower when using AI on code they already knew (METR, 2025)."
      - "Prediction, not evidence: AI will keep moving up to the next kind of work. How fast, nobody knows for sure."
    evidence_note_html: 'Indonesia-specific data is still thin. We haven''t found any official figures on the effect of AI on programmer job openings in Indonesia. Details in the <a href="#sumber">sources</a>.'
    bridge: "Is there another answer besides efficiency?"

  km:
    eyebrow: "Evidence 1 · The threat is real"
    title: "If a non-coder can build this, what is a coder worth?"
    intro_html: 'Nurul Bahirah, an education consultant who can''t code, built the first version of <strong>Kebun Makna</strong> in <strong>2 hours</strong> with Claude Code: a free game that helps children learn the meaning of the short surahs of Juz 30, word by word.'
    compare:
      title: "If it were built the old way"
      ai_label: "With Claude Code"
      ai_value: "2 hours · 1 person"
      ai_note: "Nurul alone, with no coding background"
      before_label: "Before AI"
      before_value: "4–6 months · 5 paid people"
      before_note: "A game designer, a pixel-art illustrator, two programmers (one just for voice recognition), and a tester"
      caption: "The “before AI” figure is our own estimate for a game the size of the first version of Kebun Makna, not a measurement."
    question: "The honest answer: the value shifts, it doesn't disappear."
    answer:
      - "Nurul didn't start from the technology. She started from what she understands best: how children learn. Her edge is a deep understanding of the user and the problem. That is what programmers usually don't have."
      - "But Kebun Makna is a first version for a single need, not a production system serving thousands of transactions. Once an app stores customer data, takes payments, or has to keep running three years from now, some things often get missed: data security, reliability, and code that can be maintained. The examples are real: in 2025, 170 of 1,645 AI-built apps that were scanned exposed their users' data because one database setting was missed, and in a Veracode test, AI-generated code contained common security flaws in 45% of tasks."
      - "So a programmer's value shifts: from writing code, to understanding the problem and the user, then judging the quality, security, and durability of the solution. That first gap is what this program fills."
    link: "Try Kebun Makna"
    table_title: "Who brings what"
    table_head: ["What Nurul has", "What programmers usually have", "What this program adds"]
    table_rows:
      - aspect: "Users & problem"
        nurul: "Knows exactly how children learn"
        dev: "Rarely meet users; receive tickets"
        adds: "Real user interviews every week"
      - aspect: "Building"
        nurul: "Claude Code, no coding background"
        dev: "Can code, some not yet used to AI"
        adds: "Claude Code + Supabase + GitHub as everyday tools"
      - aspect: "Quality & security"
        nurul: "Not a focus in the first version"
        dev: "Know how to test, secure, and maintain code"
        adds: "Kept, and used to judge what AI produces"
      - aspect: "Communication"
        nurul: "Used to explaining things to parents and children"
        dev: "Often nervous in front of users or bosses"
        adds: "Toastmasters-style speaking practice every week"
    footnote_html: 'An honest note: Kebun Makna proves the <em>threat</em>, not yet the <em>solution</em>. Evidence that programmers can shift roles: <mark class="bk-ph">[FILL: example of a programmer who shifted roles / pilot result]</mark>.'

  paths:
    eyebrow: "Two paths"
    title: "Yes, there is a path besides efficiency"
    intro: "Both make sense. One cuts the cost; the other changes what that cost buys."
    list:
      - label: "Path 1"
        icon: briefcase
        title: "Efficiency: reduce the payroll"
        text: "Reasonable to consider, and sometimes necessary. But there is real severance pay (pesangon), the risk of disputes, and system knowledge that walks out the door."
      - label: "Path 2"
        icon: spark
        new: true
        title: "Move people into problem solving"
        text: "Shift the team away from the work AI is taking, toward finding and solving real problems for the company's users: work that brings in revenue."
    note: "These two paths don't exclude each other. Many companies will use both."

  cost:
    eyebrow: "Cost of path 1"
    title: "What does it actually cost to let 5 programmers go?"
    intro: "Layoffs in Indonesia are governed by Government Regulation 35/2021 (PP 35/2021). The calculation is severance pay (pesangon) + long-service pay (UPMK) + entitlement compensation (UPH), based on basic wage plus fixed allowances. Adjust the numbers to your situation."
    table_caption: "Multiples of monthly wage per person (PP 35/2021, Article 40)"
    head_tenure: "Length of service"
    head_pes: "Severance (pesangon)"
    head_upmk: "UPMK"
    rows:
      - ["< 1 year", "1 month", "–"]
      - ["1–2 years", "2 months", "–"]
      - ["2–3 years", "3 months", "–"]
      - ["3–6 years", "4–6 months", "2 months"]
      - ["6–9 years", "7–9 months", "3 months"]
      - ["9–12 years", "9 months", "4 months"]
      - ["12–24 years", "9 months", "5–8 months"]
      - ["≥ 24 years", "9 months", "10 months"]
    rules_title: "Things to keep in mind"
    rules:
      - "Efficiency because the company is losing money: 0.5× severance. Efficiency to prevent losses: 1× severance. UPMK stays at 1× (Article 43)."
      - "The loss has to be proven, for example through an internal or external audit. Without proof, a dispute at the Industrial Relations Court (PHI) is more likely."
      - "Replacing an employee with a cheaper person for the same position is hard to call efficiency, because efficiency is tied to losses or preventing losses. The risk of a dispute is high. This is our own analysis, not a court ruling."
      - "The House of Representatives passed the Employment Protection Law on 6 October 2026, following Constitutional Court decision 168/PUU-XXI/2023. We haven't confirmed the implementing rules. The multiples above may already have changed: check with a legal consultant before using these numbers."
    calc_title: "Estimate your own"
    calc_n: "Number of programmers:"
    calc_wage: "Basic wage + fixed allowances per month (example, replace with your own figure)"
    calc_tenure: "Average length of service:"
    calc_years: "years"
    calc_reason: "Reason for efficiency"
    calc_loss: "Because of losses (0.5×)"
    calc_prevent: "Preventing losses (1×)"
    calc_fee: "Program fee for the same people (optional)"
    calc_fee_ph: "fill in once you have a quote"
    out_pes: "Severance (pesangon)"
    out_upmk: "UPMK"
    out_total: "Estimated total (UPH not included)"
    bar_sev: "Pesangon + UPMK"
    bar_fee: "Program fee"
    bar_fee_empty: "[FILL: program price]"
    calc_note: "A rough estimate, not legal advice. It does not include UPH (unused leave, travel costs home), the cost of recruiting replacements, or the cost of disputes. Verify with an HR or legal consultant."
    options_title: "A realistic third path: hold hiring + let turnover happen naturally"
    options_intro: "Many owners will choose this: don't hire replacements, wait for people to leave on their own, then fill the need with AI-fluent juniors. It's a legitimate choice. Let's compare it honestly."
    options_head: ["Efficiency (layoffs)", "Hold hiring + turnover", "This program"]
    options_rows:
      - aspect: "Direct cost"
        a: "Pesangon + UPMK + UPH, paid up front"
        b: "Almost zero; payroll shrinks slowly"
        c: '<mark class="bk-ph">[FILL: price]</mark> per cohort'
      - aspect: "Speed of effect"
        a: "Fast (this month)"
        b: "Slow, and you can't control who leaves"
        c: "3 months until the first capstone is running"
      - aspect: "Risk"
        a: "Disputes, your reputation as an employer"
        b: "The ones who leave are the best ones"
        c: "Some participants don't manage to shift"
      - aspect: "Morale of the remaining team"
        a: "Drops; everyone waits for their turn"
        b: "Workload rises for those who stay"
        c: "A clear career direction"
      - aspect: "System knowledge"
        a: "Walks out the door"
        b: "Walks out, slowly"
        c: "Stays inside, plus an understanding of users"
    not_solve: "What this program does not solve: the number of people. It improves effectiveness, not headcount. If your problem really is too many people for the business you have, this program is not the answer."
    footnote_html: 'Source: <a href="#sumber">PP 35/2021</a>. The table above is simplified; severance rises by one month for each year of service, up to 9 months. All the numbers in the calculator are examples you can change.'

  program:
    eyebrow: "The program"
    title: "Two tracks, one goal: user problems that actually get solved"
    intro: "A fully remote development program designed and led by Ricky Saif. Each participant or small team (squad) brings one real problem tied to the company's core business, then solves it all the way to something working."
    tracks:
      - code: "A"
        name: "Communication"
        text: "Toastmasters-style speaking practice: being confident and fluent in front of users. Listening, asking, explaining, with the goal of solving their problem."
        steps:
          - code: "A1"
            text: "Speak for 2 minutes without preparation (table topics)"
          - code: "A2"
            text: "User interviews: asking without leading"
          - code: "A3"
            text: "Explaining the solution to a non-technical person"
          - code: "A4"
            text: "Peer evaluation: one compliment, one suggestion"
          - code: "A5"
            text: "Capstone presentation in front of the owner"
      - code: "B"
        name: "Build"
        text: "Hands-on practice with Claude Code + Supabase + GitHub Pages to build the solution. Follows the order of the D path in the Claude Code Indonesia community."
        steps:
          - code: "D-04"
            text: "First App"
          - code: "D-05"
            text: "CLAUDE.md"
          - code: "D-06"
            text: "Git & GitHub"
          - code: "D-07"
            text: "Supabase"
          - code: "D-08"
            text: "Google Login"
          - code: "D-11"
            text: "Publish"
    tm_note: "“Toastmasters-style” only describes the format. This program is not affiliated with Toastmasters International."
    week_title: "Weekly rhythm"
    week_text: "All online. Designed to fit alongside everyday work."
    week:
      - "Monday · 60-minute Communication session (Zoom/Meet)"
      - "Tuesday–Thursday · Talk to at least 2 users"
      - "Wednesday · 90-minute Build session, live with Claude Code"
      - "Friday · 5-minute demo per squad + evaluation"
    week_note: 'Estimated time for participants: <mark class="bk-ph">[FILL: 4–6 hours/week]</mark> including sessions.'
    format:
      - label: "Duration"
        value_html: '<mark class="bk-ph">[FILL: 12 weeks]</mark>'
      - label: "Cohort size"
        value_html: '<mark class="bk-ph">[FILL: 6–12 people, squads of 2–3]</mark>'
      - label: "Language"
        value_html: '<mark class="bk-ph">[FILL: Indonesian]</mark>'

  capstone:
    eyebrow: "Capstone"
    title: "The capstone is the proof"
    intro: "Not a written exam. Each squad finds a real problem, talks to its users, builds, and ships a solution that people actually use."
    steps:
      - time: "Weeks 1–2"
        title: "Find the problem"
        text: "Pick one problem close to the core business: one that wastes time, money, or customers."
      - time: "Weeks 2–4"
        title: "Talk to users"
        text: "At least 5 interviews. The goal is to understand, not to sell an idea."
      - time: "Weeks 4–9"
        title: "Build"
        text: "A first version as fast as possible, then improve it together with its users."
      - time: "Weeks 9–11"
        title: "Ship"
        text: "Used by real people, and measured."
      - time: "Week 12"
        title: "Present"
        text: "In front of the owner: the problem, the evidence, the results, and the next step."
    term:
      title: "claude · capstone-order-returns"
      note: "Illustration"
      notes_title: "Interview notes (week 3)"
      notes:
        - who: "CS:"
          text: "“For every return I check 3 places: WhatsApp, a spreadsheet, and the warehouse system.”"
        - who: "Warehouse:"
          text: "“I only find out there's a return when the goods have already arrived.”"
        - who: "Customer:"
          text: "“I asked about my return status 4 times and got a different answer each time.”"
      scenes:
        - week: "Week 5"
          prompt: "Read interview-notes.md. Build a return status page: CS enters it once, warehouse and customers can see the status."
          steps:
            - "Reading 7 interview notes, summarizing 3 needs"
            - "Creating a returns table in Supabase, with access rules per role"
            - "Building the CS input page and the status check page"
            - "Done. Ready for 2 CS agents to try tomorrow morning."
        - week: "Week 8"
          prompt: "Add a notification to the warehouse when a return is approved, then publish."
          steps:
            - "Adding the notification, testing it with sample data"
            - "Checking: no customer data is open to the public"
            - "Done. Live, used by the CS team starting Monday."
    examples_title: "Capstone examples for three kinds of business"
    examples_intro: "Made-up examples to show the shape, not real clients."
    ex_problem: "Problem"
    ex_users: "Talk to"
    ex_build: "What gets built"
    ex_measure: "Measured by"
    examples:
      - icon: store
        biz: "Distributor / wholesaler"
        problem: "Traveling sales reps don't know the latest stock, and orders often get cancelled."
        users: "Field sales, warehouse admin, 3 customer shops"
        build: "A stock-check page on mobile + an order form that goes straight to the warehouse"
        measure: "Orders cancelled because of stock, before vs after"
      - icon: heart
        biz: "Clinic"
        problem: "Patients wait a long time because the queue is recorded by hand."
        users: "Receptionist, doctor, 10 patients"
        build: "A simple online queue with an estimated time of being called"
        measure: "Average waiting time, patient complaints"
      - icon: phone
        biz: "Software company (B2B)"
        problem: "New clients take 3 weeks to actually start using the product."
        users: "Onboarding team, 5 new clients"
        build: "An interactive setup guide + a checklist that can be tracked"
        measure: "Days until the client is active, support tickets"

  owner:
    eyebrow: "What you receive"
    title: "What the owner gets at the end of the program"
    deliver_title: "Deliverables"
    deliverables:
      - "One working solution per squad, used by real users"
      - "User interview notes and validated problems"
      - "Capstone presentation, with before and after numbers"
      - "A report per participant: strengths, growth, and a suggested next role"
      - "Rules for working safely with AI and company data"
    score_title: "Success scorecard"
    score_head: ["Measure", "How it's measured", "Target"]
