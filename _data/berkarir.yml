    intro: "Yang kami sebut “bukti” punya sumber di bawah. Yang kami sebut “perkiraan” atau “prediksi” adalah penilaian kami."
    list:
      - name: "Brynjolfsson, Chandar & Chen (2025), Canaries in the Coal Mine? Stanford Digital Economy Lab"
        url: "https://digitaleconomy.stanford.edu/publications/canaries-in-the-coal-mine/"
        note: "data payroll AS, deskriptif (bukan bukti sebab-akibat); belum tentu berlaku di Indonesia"
