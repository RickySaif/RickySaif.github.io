      - metric: "Solusi dirilis"
        how: "Bisa diakses dan dipakai"
        target: '<mark class="bk-ph">[ISI: 1 per squad]</mark>'
      - metric: "Adopsi"
        how: "Pengguna aktif mingguan"
        target: '<mark class="bk-ph">[ISI]</mark>'
      - metric: "Jam kerja yang dihemat"
        how: "Perkiraan pengguna, sebelum vs sesudah"
        target: '<mark class="bk-ph">[ISI]</mark>'
      - metric: "Pendapatan yang terpengaruh"
        how: "Disepakati di awal dengan pemilik"
        target: '<mark class="bk-ph">[ISI]</mark>'
    transparency: "Terbuka sejak awal: program ini jalur pengembangan, dan pemilik akan melihat hasil capstone saat memutuskan peran. Peserta diberi tahu di sesi pertama, dengan kriteria tertulis yang bisa dicapai dengan usaha sungguh-sungguh."

  proof:
    eyebrow: "Bukti"
    title: "Siapa yang memandu, dan apa yang sudah dibuktikan"
    list:
      - label: "Bukti 2 · Pemandu"
        title: "Ricky Saif, Partner CEO di Era AI"
        text_html: "Lulusan Ilmu Komputer UI (2013), 13 tahun mendampingi organisasi. Pernah menjadi trainer manajemen dan software untuk BAPPENAS, Telkom Indigo, dan IDEMIA. Memimpin budaya dan engagement di Alterra (engagement Gallup +17%). Memfasilitasi transformasi agile skala besar (LeSS) di Dkatalis / Bank Jago: 4 tim, 35 developer dan PM. Menulis dua buku Agile/Scrum."
      - label: "Bukti 3 · Komunikasi"
        title: "“Why Culture Comes First”"
        text_html: "Pidato 8 menit yang memenangkan AgileNE. Track A dipandu oleh orang yang berlatih bicara di depan umum."
        url: "https://www.youtube.com/watch?v=_ycD1M2eW5g"
        link: "Tonton di YouTube"
      - label: "Bukti 4 · Build"
        title: "Situs Scrum AI Addendum: 38 menit waktu Claude"
        text_html: "Ricky membangun situsnya sendiri dengan Claude Code, ditambah tiga alat gratis: Customer Servicerr, Marketerr, dan Scouterr. Ia juga menjalankan komunitas Claude Code Indonesia."
        url: "https://rizkysyaiful.github.io/scrum-ai-addendum/"
        link: "Lihat hasilnya"
      - label: "Bukti 5 · Belum ada"
        missing: true
        title: "Programmer yang berhasil bergeser peran"
        text_html: 'Ini bukti yang paling penting, dan belum kami punya. <mark class="bk-ph">[ISI: contoh programmer yang bergeser peran / hasil pilot]</mark>. Pilot berbayar di bawah dirancang untuk mengisinya.'

  engage:
    eyebrow: "Pilihan kerja sama"
    title: "Mulai dari yang kecil"
    intro: "Rekomendasi kami: mulai dari sesi pengantar, lanjut ke pilot. Kohort penuh setelah pilot terbukti."
    list:
      - label: "Langkah 1"
        title: "Sesi “Berkarir di Era Problem Solving”"
        text: "Sesi pengantar 90 menit untuk pemilik dan tim, online."
        items: ["Peta perubahan pekerjaan digital", "Demo Claude Code dari nol", "Tanya jawab terbuka"]
        price_html: '<mark class="bk-ph">[ISI: gratis / harga sesi]</mark>'
      - label: "Langkah 2 · Disarankan"
        recommended: true
        title: "Pilot berbayar"
        text: "Satu kohort kecil, satu masalah nyata per squad."
        items: ["Kedua jalur, versi ringkas", "Capstone sampai rilis", "Laporan hasil untuk pemilik"]
        price_html: '<mark class="bk-ph">[ISI: harga pilot, durasi, jumlah peserta]</mark>'
      - label: "Langkah 3"
        title: "Kohort penuh"
        text: "Setelah pilot, untuk lebih banyak tim."
        items: ["Program lengkap", "Scorecard dipantau tiap bulan", "Pendampingan setelah program"]
        price_html: '<mark class="bk-ph">[ISI: harga per peserta / per kohort]</mark>'

  faq:
    title: "Pertanyaan yang biasanya muncul"
    list:
      - q: "Programmer saya tidak suka bicara dengan orang. Apakah ini akan berhasil?"
        a_html: "Mungkin tidak untuk semua orang, dan itu wajar. Track A dimulai dari latihan kecil (bicara 2 menit, wawancara satu orang) di lingkungan yang aman. Kebanyakan grogi itu soal jam terbang, bukan bakat. Kalau setelah program seseorang tetap lebih cocok di belakang layar, itu juga informasi yang berguna: perannya bisa menjadi penjaga kualitas dan keamanan hasil AI."
      - q: "Kenapa tidak langsung rekrut junior yang fasih AI?"
        a_html: "Bisa, dan untuk sebagian kebutuhan itu pilihan yang tepat. Bedanya: junior baru belum tahu bisnis, pelanggan, dan sistem Anda. Tim lama sudah tahu. Program ini menambahkan cara kerja AI dan keberanian bertemu pengguna ke orang yang sudah punya konteks. Bandingkan biaya dan risikonya di tabel di atas."
      - q: "Bagaimana kalau mereka keluar setelah dilatih?"
        a_html: "Risiko ini nyata. Dua hal membantu: solusi capstone tetap milik perusahaan dan tersimpan di repositori perusahaan, dan orang yang punya arah karier jelas cenderung lebih betah. Kalau perlu, perjanjian ikatan dinas bisa dibahas dengan HR Anda, dengan syarat yang wajar."
      - q: "Apakah hasil capstone dipakai untuk menilai peserta?"
        a_html: "Ya, dan itu disampaikan terbuka sejak hari pertama. Program ini jalur pengembangan; pemilik akan melihat hasil capstone saat memutuskan peran. Kriteria ditulis di awal, berfokus pada proses (wawancara, validasi, rilis), bukan hanya hasil akhir, dan dirancang supaya bisa dicapai dengan usaha sungguh-sungguh. Capstone menjadi salah satu masukan, bukan satu-satunya dasar keputusan."
      - q: "Bagaimana dengan data pelanggan dan kerahasiaan perusahaan?"
        a_html: "Aturan dasar sejak minggu pertama: <ol><li>Pakai data contoh atau data yang disamarkan selama membangun.</li><li>Data pribadi pelanggan baru masuk setelah ada persetujuan tertulis pemilik dan dasar pemrosesan sesuai UU PDP.</li><li>Pakai akun Claude dan Supabase milik perusahaan, bukan akun pribadi.</li><li>Aktifkan Row Level Security di setiap tabel Supabase; kunci rahasia tidak pernah masuk ke kode publik.</li><li>Repositori GitHub milik organisasi perusahaan, dan privat kalau berisi logika bisnis.</li><li>Kode dan hasil capstone milik perusahaan, ditulis di perjanjian kerja sama.</li></ol>Ini bukan nasihat hukum; sesuaikan dengan kebijakan perusahaan."
      - q: "GitHub Pages dan Supabase cukup untuk produksi?"
        a_html: "Untuk alat internal, halaman informasi, form, dan aplikasi kecil sampai menengah: biasanya cukup. Untuk sistem pembayaran, data sangat sensitif, beban sangat tinggi, atau toko online komersial di GitHub Pages: tidak, dan capstone seperti itu kami arahkan ke prototipe, lalu dipindah ke infrastruktur perusahaan. GitHub Pages tidak ditujukan untuk bisnis online komersial."
      - q: "Apakah ini program Toastmasters?"
        a_html: "Bukan. “Gaya Toastmasters” hanya menggambarkan formatnya: pidato yang disiapkan, bicara spontan, dan evaluasi antarteman. Program ini tidak berafiliasi dengan Toastmasters International."
      - q: "Apakah program ini mengurangi jumlah karyawan?"
        a_html: "Tidak. Program ini memperbaiki efektivitas, bukan jumlah orang. Kalau masalah utamanya kelebihan orang, bicarakan itu dengan jujur dulu; kami bisa bantu memikirkannya, tapi program ini bukan alat PHK terselubung."
      - q: "Bagaimana dengan karyawan non-programmer (marketing, admin)?"
        a_html: "Polanya sama: temukan masalah, bicara dengan pengguna, bangun dengan AI. Tapi Track B saat ini dirancang untuk developer. Untuk tim lain, kami sarankan mulai dari pilot programmer dulu, lalu memperluas."

  final:
    title: "Mau mulai dari mana?"
    lead: "Ceritakan bisnis Anda dan tim yang Anda pikirkan. Kita bicarakan apakah program ini cocok, termasuk kalau jawabannya tidak."
    cta_wa: "Chat WhatsApp"
    wa_text: "Halo Ricky, saya tertarik dengan program Berkarir di Era Problem Solving."
    cta_mail: "Kirim email"
    mail_subject: "Berkarir di Era Problem Solving"
    small: "Halaman ini adalah draf proposal. Angka bertanda [ISI] belum final."

  sources:
