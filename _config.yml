# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Ricky Saif
email: rizky.syaiful@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  AI Consultant for CEOs. Free AI tools and online sessions that raise profit and cut cost.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://rickysaif.github.io" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: RickySaif_gh_io

disqus:
  shortname: rizkysyaiful

# ---------------------------------------------------------------------------
# Fill-ins. Every value below is rendered as a visible [FILL: ...] marker on the
# site until it is set. Set it once here and every page picks it up.
# ---------------------------------------------------------------------------

# WhatsApp. ONE link for the whole site.
whatsapp_channel_url: "https://chat.whatsapp.com/CmPHshtEo9LFk2eKS1eCrY?mode=gi_t"

# Free tools. Every repo lives under this GitHub org.
github_url: "https://github.com/orgs/RickySaif/repositories"

# Paid online session. One price, shown on home, /consulting/ and every case.
session_price: "Rp 200.000"

# Session booking link (Google Calendar appointment schedule).
booking_url: "https://calendar.google.com/calendar/u/0/appointments/schedules/AcZssZ2Pj31GYmaSyeEc2-RC2Xq7ZRPdGa3d0RhAb_pbMhasmu6KbIiVQw9niLg4md1jQDQnbcN436Qe"



# Case studies. One file per case in _cases/ (EN) and _cases/id/ (ID).
collections:
  cases:
    output: true
    permalink: /cases/:name/

defaults:
  - scope:
      path: ""
      type: cases
    values:
      layout: case

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-polyglot

# Polyglot configuration
# English at /, Indonesian at /id/. An Indonesian page is any file with
# `lang: id` and the same permalink as its English twin (see id/ and _cases/id/).
languages:
  - en
  - id
default_lang: en
exclude_from_localization: [javascript, images, css, assets]
exclude:
  - Gemfile
  - Gemfile.lock
  - IMPLEMENTATION_SUMMARY.md
  - MULTILINGUAL_SETUP.md
  - vendor
  - vendor/bundle

# Minima date format
# refer to http://shopify.github.io/liquid/filters/date/ if you want to customize this
minima:
  date_format: "%-d %b %Y"

github: [metadata]
