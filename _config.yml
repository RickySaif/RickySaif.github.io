# Case studies. One file per case in _cases/ (EN) and _cases/id/ (ID).
collections:
  cases:
    output: true
    permalink: /cases/:name/

defaults:
  - scope:
      path: ""
      type: cases
    values:
      layout: case

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-polyglot

# Polyglot configuration
# Indonesian at /, English at /en/. An English page is any file with
# `lang: en` and the same permalink as its Indonesian twin (see id/ and _cases/id/).
# Old /id/... links are forwarded by 404.html.
languages:
  - en
  - id
default_lang: id
exclude_from_localization: [javascript, images, css, assets]
exclude:
  - Gemfile
  - Gemfile.lock
  - IMPLEMENTATION_SUMMARY.md
  - MULTILINGUAL_SETUP.md
  - vendor
  - vendor/bundle
  - graphify-out
  - .graphifyignore

# Minima date format
# refer to http://shopify.github.io/liquid/filters/date/ if you want to customize this
minima:
  date_format: "%-d %b %Y"

github: [metadata]

