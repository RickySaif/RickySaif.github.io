<style>

*{box-sizing:border-box}

.btn.green{background:#7CD35E}.btn.ghost{background:#fff}.btn.red{background:#F28B82}
.btn:disabled{opacity:.5;cursor:default}

.w.near{background:var(--nearbg);border-color:var(--near)}
.w.bad{background:var(--badbg);border-color:var(--bad)}
.w.miss{background:var(--missbg);border-color:var(--miss);border-style:dashed;opacity:.8}
.tr{font-size:15px;text-align:center;color:#5A4A3A}
.status{font-size:15px;text-align:center;min-height:22px;margin-top:8px}
.heard{font-family:var(--f-ar);font-size:22px;direction:rtl;background:#fff;border:2px dashed #C9B98F;border-radius:6px;padding:6px 10px;min-height:42px;margin-top:8px}
.verdict{font-size:20px;font-weight:700;text-align:center;margin:4px 0 8px}
.legend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:13px;margin-top:8px}
.legend span{padding:2px 8px;border-radius:5px;border:2px solid}
.tip{font-size:15px;background:#FFF4C2;border:2px solid #B8860B;border-radius:6px;padding:8px 10px;margin-top:10px}
details summary{cursor:pointer;font-weight:700}
.small{font-size:13px;color:#5A4A3A;line-height:1.45}
.seg{display:flex;border:3px solid var(--ink);border-radius:6px;overflow:hidden}
.seg button{flex:1;font:inherit;font-weight:700;border:0;background:#fff;padding:8px;cursor:pointer;color:var(--ink)}

.pulse{animation:p 1s infinite}@keyframes p{50%{opacity:.6}}

/* ---------- pencocok bacaan (tanpa tajwid, hanya kata) ---------- */
const MARKS=/[ؐ-ًؚ-ٰٟۖ-ۭـ࣓-ࣿ]/g;
function norm(s){
  return s.replace(MARKS,'')
    .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ئ/g,'ي').replace(/ؤ/g,'و').replace(/ة/g,'ه').replace(/ء/g,'')
    .replace(/[^ء-ي\s]/g,' ').replace(/\s+/g,' ').trim();
}
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; }
  return p[n]; }
/* kata pendek (anta/ana/antum) harus persis: beda 1 huruf bisa beda arti */
function grade(e,h){ const d=lev(e,h), L=e.length;
  if(d===0||(L>=4&&d===1)||(L>=7&&d===2)) return 'ok';
  if(d===1||(L>=5&&sim(e,h)>=0.6)) return 'near';
  return 'bad'; }
function sim(a,b){ if(!a||!b) return 0; return 1-lev(a,b)/Math.max(a.length,b.length); }
/* expected: array of word strings; heard: transcript string.
   returns [{i, word, heard, s, st:'ok'|'near'|'bad'|'miss'}], extra:[...] */
function check(expected,heard){
  const E=expected.map(norm), R=norm(heard).split(' ').filter(Boolean);
  const n=E.length,m=R.length, NEG=-1e9;
  const D=Array.from({length:n+1},()=>Array(m+1).fill(NEG)), B=Array.from({length:n+1},()=>Array(m+1).fill(null));
  D[0][0]=0;
  const upd=(i,j,v,bk)=>{ if(v>D[i][j]){D[i][j]=v;B[i][j]=bk;} };
  for(let i=0;i<=n;i++) for(let j=0;j<=m;j++){ const v=D[i][j]; if(v===NEG) continue;
    if(i<n) upd(i+1,j,v-0.35,{t:'miss',i,j});                     // kata terlewat
    if(j<m) upd(i,j+1,v-0.15,{t:'extra',i,j});                    // kata tambahan
    if(i<n&&j<m){ const s=sim(E[i],R[j]); upd(i+1,j+1,v+s-0.5,{t:'m',i,j,s,h:R[j]}); }
    if(i<n&&j+1<m){ const h=R[j]+R[j+1]; const s=sim(E[i],h); upd(i+1,j+2,v+s-0.55,{t:'m',i,j,s,h:R[j]+' '+R[j+1],k:2}); }   // satu kata terpecah dua
    if(i+1<n&&j<m){ const s=sim(E[i]+E[i+1],R[j]); if(s>=0.8) upd(i+2,j+1,v+2*s-1.3,{t:'m2',i,j,s,h:R[j]}); } // dua kata menyatu
  }
  const res=expected.map((w,i)=>({i,word:w,heard:'',s:0,st:'miss'})), extra=[];
  let i=n,j=m;
  while(i>0||j>0){ const b=B[i][j]; if(!b) break;
    if(b.t==='miss'){} else if(b.t==='extra'){ extra.unshift(R[b.j]); }
    else { const st=grade(b.t==='m2'?E[b.i]+E[b.i+1]:E[b.i],b.h.replace(/ /g,''));
      res[b.i]={i:b.i,word:expected[b.i],heard:b.h,s:b.s,st};
      if(b.t==='m2') res[b.i+1]={i:b.i+1,word:expected[b.i+1],heard:b.h,s:b.s,st}; }
    i=b.i; j=b.j; }
  return {res,extra};
}


const $=id=>document.getElementById(id);
const log=m=>{const l=$('log');l.textContent+=m+'\n';l.scrollTop=1e9;};
const MODEL='eventhorizon0/tarteel-ai-onnx-whisper-base-ar-quran';
const HAS_GPU=!!navigator.gpu;
const SO={graphOptimizationLevel:'basic',enableCpuMemArena:false,enableMemPattern:false};

 {id:'q4',label:'Kecil · q4 · sekitar 140 MB (coba ini dulu)',dtype:{encoder_model:'q4',decoder_model_merged:'q4'},device:'wasm'},

DATA.forEach(s=>$('sur').append(new Option(`${s.no}. ${s.name}`,s.no)));

function target(){const s=DATA.find(x=>x.no==$('sur').value);const ay=s.ayat.find(a=>a.n==$('ay').value)||s.ayat[0];return {s,ay,words:ay.w};}
let cur=null,lastRes=null;

let asr=null,loading=false;
$('load').onclick=async()=>{

  try{
    $('lstat').textContent='Memuat pustaka…';
    const T=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1');

    log('Pustaka dimuat '+((performance.now()-t0)/1000).toFixed(1)+' dtk');
    if(T.env.backends&&T.env.backends.onnx&&T.env.backends.onnx.wasm) T.env.backends.onnx.wasm.numThreads=1;

async function toPCM(blob){
  const buf=await blob.arrayBuffer(); const AC=window.AudioContext||window.webkitAudioContext; const ac=new AC();
  const dec=await new Promise((ok,no)=>ac.decodeAudioData(buf,ok,no)); ac.close&&ac.close();
  const n=Math.ceil(dec.duration*16000), off=new OfflineAudioContext(1,n,16000); const src=off.createBufferSource(); src.buffer=dec; src.connect(off.destination); src.start();
  const out=await off.startRendering(); return {pcm:out.getChannelData(0),dur:dec.duration};
}
function voiceStats(pcm){ const W=1600; let peak=0,voiced=0; const rms=[]; for(let i=0;i+W<=pcm.length;i+=W){ let s=0; for(let j=0;j<W;j++){ const v=pcm[i+j]; s+=v*v; const a=Math.abs(v); if(a>peak) peak=a; } rms.push(Math.sqrt(s/W)); }
  const sorted=[...rms].sort((a,b)=>a-b); const floor=sorted[Math.floor(sorted.length*0.2)]||0; const thr=Math.max(0.012,floor*3);
  rms.forEach(r=>{ if(r>thr) voiced+=0.1; }); return {peak,voiced}; }
let mr=null,stream=null;
$('mic').onclick=async()=>{
  if(mr){ mr.stop(); return; }
  try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ $('status').textContent='Mikrofon tidak diizinkan ('+e.name+'). Izinkan mikrofon untuk halaman ini di pengaturan browser.'; return; }
  const chunks=[]; mr=new MediaRecorder(stream); mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  mr.onstop=async()=>{ stream.getTracks().forEach(t=>t.stop()); const type=mr.mimeType; mr=null; $('mic').textContent='🎙️ Mulai baca'; $('mic').className='btn mic'; $('mic').disabled=true; $('status').textContent='Mendengarkan…';
    try{ const {pcm,dur}=await toPCM(new Blob(chunks,{type}));
      const vd=voiceStats(pcm); log(`Suara: puncak ${vd.peak.toFixed(3)}, bersuara ${vd.voiced.toFixed(1)} dtk dari ${dur.toFixed(1)} dtk`);
      if(vd.voiced<0.6){ $('status').textContent='Tidak ada suara yang terdengar. Dekatkan perangkat ke mulut dan coba lagi.'; $('mic').disabled=false; return; }
      const t0=performance.now(); let out;
      try{ out=await asr(pcm,{language:'arabic',task:'transcribe',is_multilingual:true,chunk_length_s:30}); }
      catch(e1){ log('Percobaan 1 gagal: '+e1.message); out=await asr(pcm,{chunk_length_s:30}); }
      const sec=(performance.now()-t0)/1000;
      const text=(out.text||'').trim(); log(`Rekaman ${dur.toFixed(1)} dtk (${type}) → ${sec.toFixed(1)} dtk proses → "${text}"`);
      show(text,dur,sec);
    }catch(e){ $('status').textContent='Gagal memproses: '+(e&&e.message||e); log('GAGAL proses: '+(e&&e.stack||e)); }
    $('mic').disabled=false; };
  mr.start(); $('mic').textContent='⏹️ Selesai'; $('mic').className='btn mic red pulse'; $('status').textContent='Merekam… silakan baca.';
};
function show(text,dur,sec){
  lastRes=check(cur.words.map(w=>w[0]),text); const r=lastRes.res,n=r.length,ok=r.filter(x=>x.st==='ok').length,near=r.filter(x=>x.st==='near').length;
  render(r); $('result').hidden=false; $('heard').textContent=text||'(tidak ada)'; $('status').textContent='Selesai.';
  $('verdict').textContent=ok===n?`MasyaAllah! Semua ${n} kata terdengar pas 🌟`:ok+near===n?`Bagus! ${ok} dari ${n} kata pas, sisanya hampir.`:`${ok} dari ${n} kata terdengar pas.`;
  const bad=r.filter(x=>x.st==='bad'||x.st==='miss'); const tip=$('tip'); tip.hidden=!bad.length; tip.textContent=bad.length?'Perhatikan: '+bad.map(x=>x.st==='miss'?`${x.word} belum terdengar`:`${x.word} terdengar seperti ${x.heard}`).join(' · '):'';
  $('metrics').textContent=`Rekaman ${dur.toFixed(1)} dtk · diproses ${sec.toFixed(1)} dtk · cocok ${ok}/${n}`;
}
