<meta charset="utf-8">
<title>Kebun Makna</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&family=Scheherazade+New:wght@400;700&display=swap">
<style>
/* Layout: SNES-style farm. Pixel canvas on top, dialog box below it, full-screen panels for lessons.
   One committed daytime look (single theme), every color set explicitly. */
:root{
  color-scheme:light;
  --sky:#8FD3F4;
  --grass:#5DBB4A;
  --grass-d:#3E8E35;
  --wood:#8A5A33;
  --wood-d:#5A3820;
  --paper:#FFF6DC;
  --paper-d:#F1DFAE;
  --ink:#2B1D12;
  --ink-soft:#6A4E36;
  --red:#C8463A;
  --gold:#F4B400;
  --blue:#3A78C9;
  --ok:#2F8F3A;
  --no:#C0472E;
  --f-pix:"Pixelify Sans","Courier New",ui-monospace,monospace;
  --f-ar:"Scheherazade New","Amiri","Noto Naskh Arabic","Traditional Arabic",serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--grass-d);color:var(--ink);font-family:var(--f-pix);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(circle at 25% 25%,rgba(255,255,255,.06) 2px,transparent 2px);background-size:12px 12px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px 32px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate}

/* pixel frames */
.frame{background:var(--paper);border:4px solid var(--ink);box-shadow:inset 0 0 0 3px var(--paper-d),4px 4px 0 rgba(0,0,0,.35);border-radius:6px;padding:12px 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;background:var(--gold);color:var(--ink);border:3px solid var(--ink);border-radius:4px;box-shadow:0 4px 0 var(--ink);font-weight:700;font-size:18px;text-transform:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn[disabled]{background:#CFC3A3;color:#7D6E55;box-shadow:0 2px 0 #7D6E55;border-color:#7D6E55;cursor:not-allowed}
.btn.green{background:#7CD35E}.btn.blue{background:#8CC8F5}.btn.ghost{background:var(--paper)}
.btn.block{display:flex;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* HUD */
.hud{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.hud .chip{display:flex;align-items:center;gap:6px;background:var(--paper);border:3px solid var(--ink);border-radius:4px;padding:3px 8px;font-weight:700;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.hud .chip img{width:16px;height:16px;image-rendering:pixelated}
.hud .grow{flex:1;min-width:0;color:var(--paper);font-weight:700;text-shadow:2px 2px 0 var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .icon{width:40px;height:40px;padding:0;font-size:18px}

.stage{position:relative;border:4px solid var(--ink);border-radius:6px;overflow:hidden;box-shadow:4px 4px 0 rgba(0,0,0,.35);background:var(--grass)}
canvas#farm{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:manipulation;cursor:pointer}

/* dialog box */
.dialog{margin-top:10px;display:flex;gap:12px;align-items:flex-start;min-height:120px}
.dialog .portrait{flex:none;width:64px;height:64px;border:3px solid var(--ink);background:#BFE7FA;border-radius:4px;image-rendering:pixelated}
.dialog .body{flex:1;min-width:0}
.dialog .who{font-weight:700;color:var(--red);font-size:15px}
.dialog .txt{margin:2px 0 10px;min-height:2.9em}
.hint{font-size:14px;color:var(--ink-soft)}

/* full-screen panel */
.panel{position:fixed;inset:0;z-index:30;overflow-y:auto;background:#8FD3F4;
  background-image:linear-gradient(to bottom,#8FD3F4 0 60%,#BDE8B0 60% 100%)}
.panel .wrap{padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px))}
.ptop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ptop .t{flex:1;min-width:0}
.ptop .t b{display:block;font-size:20px;text-shadow:2px 2px 0 #fff}
.ptop .t span{font-size:14px;color:var(--ink-soft)}
.steps{display:flex;gap:6px;margin:0 0 12px}
.steps i{flex:1;height:10px;border:2px solid var(--ink);background:var(--paper);border-radius:2px}
.steps i.on{background:var(--gold)}.steps i.past{background:#7CD35E}
h2{font-size:24px;margin:0 0 4px;font-weight:700;text-wrap:balance}
.lead{margin:0 0 12px;color:var(--ink-soft);font-size:15px}

.ayahbig{font-size:34px;line-height:2.1;text-align:center;padding:8px 4px}
.ayahbig span{border-radius:6px;padding:0 3px;transition:background .12s}
.ayahbig span.now{background:#FFE07A;box-shadow:0 0 0 2px var(--gold)}
.trans{margin-top:8px;padding:10px 12px;background:#fff;border:3px dashed var(--paper-d);border-radius:4px;font-size:16px}

.cards{display:flex;flex-wrap:wrap;gap:10px;direction:rtl}
.card{flex:1 1 calc(50% - 10px);min-width:128px;min-height:118px;border:3px solid var(--ink);border-radius:4px;background:#fff;display:grid;place-items:center;padding:8px;text-align:center;box-shadow:0 4px 0 var(--ink)}
.card .w{font-size:38px;line-height:1.5}
.card .m{direction:ltr;font-weight:700;font-size:17px;color:var(--ok)}
.card .e{font-size:24px;line-height:1}
.card .tap{direction:ltr;font-size:12px;color:var(--ink-soft)}
.card.open{background:#E4F7D8}
.card.playing{background:#FFF1B8}

.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.chip2{min-height:60px;border:3px solid var(--ink);border-radius:4px;background:#fff;padding:6px 8px;box-shadow:0 4px 0 var(--ink)}
.chip2.ar{font-size:30px;line-height:1.3}
.chip2.mn{font-weight:700;font-size:15px}
.chip2.sel{background:#FFF1B8}
.chip2.good{background:#CFEFC0;opacity:.6;pointer-events:none}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.slots{display:flex;flex-wrap:wrap;gap:8px;direction:rtl;min-height:84px;padding:10px;border:3px dashed var(--wood);background:rgba(255,255,255,.5);border-radius:4px}
.slot{min-width:62px;min-height:60px;border:3px solid var(--wood);border-radius:4px;background:var(--paper-d);display:grid;place-items:center;padding:2px 8px}
.slot.filled{background:#fff;border-color:var(--ink)}
.slot.bad{background:#F8D2C6;border-color:var(--no)}
.pool{display:flex;flex-wrap:wrap;gap:8px;direction:rtl;margin-top:12px}
.tile{border:3px solid var(--ink);border-radius:4px;background:#fff;padding:2px 10px 6px;display:grid;justify-items:center;box-shadow:0 4px 0 var(--ink)}
.tile .w{font-size:28px;line-height:1.5}
.tile .m{font-size:12px;color:var(--ink-soft);direction:ltr}
.tile.used{visibility:hidden}

.opts{display:grid;gap:10px;margin-top:12px}
.opt{padding:12px;border:3px solid var(--ink);border-radius:4px;background:#fff;font-weight:700;text-align:left;box-shadow:0 4px 0 var(--ink)}
.opt.good{background:#CFEFC0}.opt.bad{background:#F8D2C6}
.fb{min-height:24px;margin-top:10px;font-weight:700}
.fb.good{color:var(--ok)}.fb.bad{color:var(--no)}
.qayah{font-size:30px;line-height:2.1;text-align:center;background:#fff;border:3px solid var(--ink);border-radius:4px;padding:8px}
.qayah mark{background:#FFE07A;color:inherit;border-radius:4px;padding:0 4px}

/* celebration */
.celebrate{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(43,29,18,.55);padding:16px}
.celebrate .frame{max-width:420px;width:100%;text-align:center}
.celebrate .big{font-size:30px;font-weight:700;color:var(--red);line-height:1.15;margin:6px 0}
.burst{width:120px;height:120px;margin:0 auto;image-rendering:pixelated}
.coinup{font-size:22px;font-weight:700;color:#9A6B00}
.pop{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.spin{animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* onboarding */
.title{text-align:center;padding-top:8px}
.title h1{font-size:44px;margin:0;color:#fff;text-shadow:4px 4px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);letter-spacing:1px}
.title p{color:#fff;text-shadow:2px 2px 0 var(--ink);margin:4px 0 14px}
.field{display:grid;gap:6px;margin:10px 0}
.field input{font:inherit;font-size:20px;padding:10px 12px;border:3px solid var(--ink);border-radius:4px;background:#fff;width:100%}
.avatars{display:flex;gap:12px}
.av{flex:1;border:3px solid var(--ink);border-radius:4px;background:#fff;padding:8px;display:grid;justify-items:center;gap:4px;box-shadow:0 4px 0 var(--ink)}
.av canvas{width:72px;height:96px;image-rendering:pixelated}
.av.on{background:#FFF1B8;outline:3px solid var(--gold)}

/* shop & lists */
.list{display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:4px;padding:10px;box-shadow:0 4px 0 var(--ink)}
.item img{width:48px;height:48px;image-rendering:pixelated;flex:none}
.item .t{flex:1;min-width:0}
.item .t b{display:block}
.item .t span{font-size:14px;color:var(--ink-soft)}

/* parent */
.ptab{display:flex;gap:8px;margin:6px 0 12px;flex-wrap:wrap}
.ptab button{padding:6px 10px;border:3px solid var(--ink);background:var(--paper);border-radius:4px;font-weight:700;font-size:14px}
.ptab button.on{background:var(--gold)}
.box{background:#fff;border:3px solid var(--ink);border-radius:4px;padding:12px;margin-bottom:12px}
.box h3{margin:0 0 6px;font-size:19px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-family:system-ui,sans-serif}
td,th{padding:6px 8px;border-bottom:1px solid #E5D7B5;vertical-align:top;text-align:left}
td.ar{font-size:24px;text-align:right;white-space:nowrap}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:3px;background:#FFE7A0}
.small{font-size:13px}
.toggle{display:flex;align-items:center;gap:10px;margin-top:8px}
.toggle input{width:22px;height:22px;accent-color:var(--ok)}
.confirm{margin-top:8px;padding:10px;background:#FBE1D8;border:2px solid var(--no);border-radius:4px}
.sys{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:4px;font-weight:700;font-size:15px;z-index:80;max-width:calc(100% - 32px);border:2px solid var(--paper)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
/* additions for v3: clock, stars, book, minigames */
.hud2{display:flex;align-items:center;gap:8px;margin:-2px 0 8px}
.clock{display:flex;align-items:center;gap:6px;background:var(--paper);border:3px solid var(--ink);border-radius:4px;padding:2px 8px;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.vbar{flex:1;min-width:0;display:flex;align-items:center;gap:6px;color:var(--paper);font-weight:700;font-size:13px;text-shadow:1px 1px 0 var(--ink)}
.vbar .track{flex:1;height:12px;border:3px solid var(--ink);background:var(--paper);border-radius:3px;overflow:hidden}
.vbar .fillb{height:100%;background:#7CD35E}
.stars{font-size:34px;letter-spacing:4px;color:#D9C9A0;text-shadow:2px 2px 0 var(--ink)}
.stars b{color:var(--gold)}
.combo{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:70;font-size:34px;font-weight:700;color:var(--gold);text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink);pointer-events:none}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.bk{border:3px solid var(--ink);border-radius:4px;background:#fff;padding:6px;text-align:center;min-height:92px;display:grid;place-items:center}
.bk .w{font-size:26px;line-height:1.4}
.bk .m{font-size:12px;font-weight:700;color:var(--ok)}
.bk.lock{background:#E9DFC6;color:#9C8B66;font-size:28px}
.bk.gold{background:#FFF4C2;border-color:#B8860B;box-shadow:inset 0 0 0 2px var(--gold)}
.mg{display:block;width:100%;height:auto;image-rendering:pixelated;border:4px solid var(--ink);border-radius:6px;background:#8FD3F4}
.mgbar{display:flex;justify-content:space-between;gap:8px;font-weight:700;margin:8px 0;font-variant-numeric:tabular-nums}
.qprompt{text-align:center;padding:6px 0}
.qprompt .ar{font-size:40px;line-height:1.6}
.qprompt .ayah{font-size:28px;line-height:2}
.opt.ar{font-size:28px;text-align:center;font-family:var(--f-ar)}
.sleepfade{position:fixed;inset:0;z-index:90;background:#0B1020;color:#fff;display:grid;place-items:center;font-size:26px;font-weight:700;opacity:0;transition:opacity .6s}
.sleepfade.on{opacity:1}
.milestones{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.milestones li{display:flex;gap:8px;align-items:center}
.milestones li b{width:22px;text-align:center}
.item{position:relative}
.item.new{background:#FFF6CC;border-color:#C8463A;box-shadow:0 4px 0 #C8463A}
.newtag{position:absolute;top:-10px;left:8px;background:#C8463A;color:#fff;font-weight:700;font-size:12px;padding:1px 8px;border:2px solid var(--ink);border-radius:3px;animation:bob 0.8s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.lvchip{cursor:pointer;flex-direction:column;align-items:stretch;gap:2px;padding:2px 8px;font-size:14px}
.minibar{display:block;width:44px;height:5px;background:#E6D9B5;border:1px solid var(--ink)}
.minibar i{display:block;height:100%;background:#7CD35E}
.xpbar{height:14px;border:3px solid var(--ink);background:var(--paper-d);border-radius:3px;overflow:hidden}
.xpbar div{height:100%;background:#7CD35E}
.xppop{position:fixed;right:16px;top:calc(70px + env(safe-area-inset-top,0px));z-index:75;background:#2F8F3A;color:#fff;font-weight:700;padding:4px 10px;border:3px solid var(--ink);border-radius:4px;animation:xpup 1.3s ease-out forwards;pointer-events:none}
@keyframes xpup{0%{transform:translateY(10px);opacity:0}20%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(-16px);opacity:0}}
.mission.cur{border-color:#C8463A;background:#FFF6CC}
.mission.lock{background:#EFE6CF;color:#8C7B57}
.story{display:grid;gap:8px;margin-top:8px}
.srow{display:grid;grid-template-columns:28px 1fr;gap:4px 10px;align-items:start;padding:8px;border:3px solid #E6D9B5;border-radius:4px;background:#fff;opacity:.75}
.srow.now{opacity:1;border-color:var(--gold);background:#FFF6CC}
.srow .n{grid-row:span 2;width:26px;height:26px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px}
.srow .ar{font-size:26px;line-height:1.9;text-align:right}
.srow .tr{font-size:15px}
.ostack{display:grid;gap:6px;min-height:60px;padding:8px;border:3px dashed var(--wood);border-radius:4px;background:rgba(255,255,255,.5)}
.orow{display:flex;gap:10px;align-items:center;text-align:right;padding:6px 8px;border:3px solid var(--ink);border-radius:4px;background:#fff}
.orow .ar{flex:1;font-size:22px;line-height:1.8}
.orow.bad{background:#F8D2C6;border-color:var(--no)}
.num{flex:none;width:24px;height:24px;border-radius:50%;background:var(--gold);border:2px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:12px}
.pool2{display:grid;gap:8px;margin-top:10px}
.aytile{display:flex;gap:8px;align-items:stretch}
.aytile .pl{flex:none;width:44px;border:3px solid var(--ink);border-radius:4px;background:#8CC8F5;font-weight:700}
.aytile .tx{flex:1;text-align:right;font-size:22px;line-height:1.8;padding:4px 10px;border:3px solid var(--ink);border-radius:4px;background:#fff;box-shadow:0 3px 0 var(--ink)}
.aytile.used{opacity:.25;pointer-events:none}
</style>

<div class="wrap" id="root"></div>
<div id="layer"></div>

function play(src,onTime){return new Promise(res=>{const t=++tok;player.src=src;player.currentTime=0;let raf;
  const tick=()=>{if(t!==tok){cancelAnimationFrame(raf);return;} onTime&&onTime(player.currentTime*1000); raf=requestAnimationFrame(tick);};
  player.onended=()=>{cancelAnimationFrame(raf);res(true)}; player.onerror=()=>{cancelAnimationFrame(raf);res(false)};
  const p=player.play(); if(p&&p.catch)p.catch(()=>res(false)); if(onTime) raf=requestAnimationFrame(tick);});}

const PLOTS=[[1,6],[4,6],[7,6],[1,8],[4,8],[7,8],[12,6],[15,6],[18,6],[12,8],[15,8],[18,8],[21,6],[24,6],[21,9],[24,9],[21,12],[24,12]];
const GATE2={x:20,y:4}, FRUIT=[[21,2],[23,2],[25,2]];
const isFar=(x,y)=>x>=20;
const GATE={x:11,y:4};
const LOTS=[[1,11],[4,11],[7,11],[9,11],[12,11],[15,11],[18,11],[1,14],[4,14],[7,14],[9,14],[12,14],[15,14],[18,14]];
const isEast=(x,y)=>x>=11&&y<=10;
const OBJ={house:{x:1,y:1,w:3,h:3,door:[2,4]},shop:{x:8,y:1,w:3,h:2,door:[9,3]},well:{x:10,y:6,w:1,h:1},sign:{x:5,y:2,w:1,h:1}};
const CHESTPOS={x:4,y:3};
const SPOT={114:[6,4],113:[5,3],112:[7,3],boss1:[6,4],111:[4,5],110:[9,5],boss2:[9,5],109:[13,5],108:[16,5],107:[19,5],boss3:[19,5],106:[13,3],105:[16,3],boss4:[16,3]};
const evLook=e=>typeof e==='number'?QUEST[e].look:BOSS[e].giver.look;
const evName=e=>typeof e==='number'?QUEST[e].npc:BOSS[e].giver.npc;
const ENTRY=[1,4];
let walkers=[];
function npcHere(){ const e=activeEvent(); if(!e||!S.arrived||!S.arrived[e]) return null; if(walkers.some(w=>w.e===e)) return null; const [x,y]=SPOT[e]; return {e,x,y}; }
function homeOf(no){ const i=ORDER.filter(n=>S.solved[n]).indexOf(no); if(i<0) return ENTRY; const [hx,hy]=LOTS[i]; return [hx+(i%2),13]; }
function giverNo(e){ if(typeof e==='number') return e; const gv=BOSS[e].giver; const n=ORDER.find(k=>QUEST[k]===gv); return n||null; }
const villagers=()=>ORDER.filter(n=>S.solved[n]).map((n,i)=>{const [hx,hy]=LOTS[i];return {no:n,hx,hy,x:hx+(i%2),y:13,away:walkers.some(w=>w.no===n)||isOut(n)};});
function isOut(n){ const e=activeEvent(); return !!(e&&typeof e==='string'&&giverNo(e)===n&&S.arrived&&S.arrived[e]); }
function blocked(x,y){
  if(x<=0||y<=0||x>=COLS-1||y>=ROWS-1) return true;
  if(x===11&&y<=10&&!(y===4&&eastOpen())) return true;
  if(isEast(x,y)&&!eastOpen()) return true;
  if(x===20&&!(y===4&&farOpen())) return true;
  if(isFar(x,y)&&!farOpen()) return true;
  if(FRUIT.some(([a,b])=>a===x&&b===y)) return true;
  for(const v of villagers()){if(x>=v.hx&&x<v.hx+2&&y>=v.hy&&y<v.hy+2)return true;}
  for(const k in OBJ){const o=OBJ[k];if(x>=o.x&&x<o.x+o.w&&y>=o.y&&y<o.y+o.h)return true;}
  for(const [a,b] of PLOTS){if(x>=a&&x<a+2&&y>=b&&y<b+2)return true;}
  const nh=npcHere(); if(nh&&x===nh.x&&y===nh.y) return true;
  if(S.chest&&x===CHESTPOS.x&&y===CHESTPOS.y) return true;
  return false;
}
function hitObject(x,y){
  for(let i=0;i<PLOTS.length;i++){const [a,b]=PLOTS[i];if(i>=6&&i<12&&!eastOpen())continue;if(i>=12&&!farOpen())continue;if(x>=a&&x<a+2&&y>=b&&y<b+2)return {type:'plot',i,tiles:[[a,b],[a+1,b],[a,b+1],[a+1,b+1]]};}
  const nh=npcHere(); if(nh&&x===nh.x&&y===nh.y) return {type:'npc',tiles:[[x,y]]};
  if(S.chest&&x===CHESTPOS.x&&y===CHESTPOS.y) return {type:'chest',tiles:[[x,y]]};
  const v=villagers().find(v=>(v.x===x&&v.y===y)||(x>=v.hx&&x<v.hx+2&&y>=v.hy&&y<v.hy+2)); if(v) return {type:'villager',no:v.no,tiles:[[v.hx,v.hy],[v.hx+1,v.hy],[v.hx,v.hy+1],[v.hx+1,v.hy+1]]};
  if(x===GATE.x&&y===GATE.y&&!eastOpen()) return {type:'gate',tiles:[[x,y]]};
  if(isEast(x,y)&&!eastOpen()) return {type:'gate',tiles:[[GATE.x,GATE.y]]};
  if(isFar(x,y)&&!farOpen()) return {type:'gate2',tiles:[[GATE2.x,GATE2.y]]};
  if(FRUIT.some(([a,b])=>a===x&&b===y)) return {type:'fruit',tiles:[[x,y]]};
  for(const k in OBJ){const o=OBJ[k];if(x>=o.x&&x<o.x+o.w&&y>=o.y&&y<o.y+o.h){const tl=[];for(let i=0;i<o.w;i++)for(let j=0;j<o.h;j++)tl.push([o.x+i,o.y+j]);return {type:k,tiles:tl};}}
  return null;
}
function bfs(sx,sy,goals){
  const key=(x,y)=>x+','+y, G=new Set(goals.map(([x,y])=>key(x,y)));
  const q=[[sx,sy]],prev={[key(sx,sy)]:null};
  while(q.length){const [x,y]=q.shift(); if(G.has(key(x,y))){const path=[];let k=key(x,y);while(k){const [a,b]=k.split(',').map(Number);path.unshift([a,b]);k=prev[k];}return path.slice(1);}
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,k=key(nx,ny);if(!(k in prev)&&!blocked(nx,ny)){prev[k]=key(x,y);q.push([nx,ny]);}}}
  return null;
}
function adjacent(tiles){const out=[];for(const [x,y] of tiles)for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(!blocked(nx,ny))out.push([nx,ny]);}return out;}

const DAY_END=16*60; // 06:00 + 16h = 22:00

function tickClock(dt){

  S.min=Math.min(DAY_END,S.min+dt/1000);
  const el=document.getElementById('clk'); if(el) el.textContent=clockStr();
  if(S.min>=DAY_END){ save(); dialog(KAKEK,['Sudah jam 10 malam. Waktunya tidur! Tanaman yang sudah disiram akan tumbuh besok pagi.'],[['Tidur 💤',sleep,'green']]); }
}

function sleep(){
  const f=$(`<div class="sleepfade">💤</div>`); document.body.append(f); requestAnimationFrame(()=>f.classList.add('on'));
  setTimeout(()=>{
    const grown=[];
    S.plots.forEach((p,i)=>{ if(p&&p.watered){ p.days=Math.min(QUEST[p.no].days,p.days+1); p.watered=false; grown.push(i);} });
    S.day++; S.min=0; S.pos={x:2,y:4};
    const chest=!S.chest && Math.random()<0.6; if(chest) S.chest=true;
    let built=null; if(S.building){ S.house=S.building.tier; built=HOUSE_TIERS[S.house].name; S.building=null; }
    const gifts=[]; ORDER.forEach(n=>{ const t=(S.vh||{})[n]||0; if(t&&Math.random()<0.5){ const c=(2+Math.floor(Math.random()*4))*t; S.coins+=c; gifts.push(`${QUEST[n].npc} memberimu ${c} koin sebagai terima kasih.`);} });
    save();
    f.textContent=`Hari ke-${S.day} · 06:00`;
    setTimeout(()=>{ f.classList.remove('on'); setTimeout(()=>f.remove(),600);
      farm(); sparkles=grown.map(i=>({i,until:performance.now()+2500}));
      if(grown.length) sfx.grow();
      const lines=[];
      if(grown.length){ grown.forEach(i=>{const p=S.plots[i],Q=QUEST[p.no]; lines.push(p.days>=Q.days?`${Q.cropName}mu sudah siap dipanen!`:`${Q.cropName}mu tumbuh! ${Q.days-p.days} hari lagi sampai panen.`);}); }
      else lines.push('Selamat pagi! Tanaman hanya tumbuh kalau disiram sehari sebelumnya.');
      if(chest) lines.push('Ada peti hadiah di depan rumah! Hampiri dan buka.');
      gifts.forEach(x=>lines.push(x));
      if(built){ lines.unshift(`Selamat pagi! Rumah barumu sudah jadi: ${built}!`); note(`${built} sudah jadi!`,'Tukang sudah selesai membangun rumahmu. Lihat di peta!',ICON.star); addXP(20); setTimeout(flushNotes,300); }
      dialog(KAKEK,lines);
    },900);
  },700);
}

function lessonStart(no){ const j=BY[no].ayat.findIndex(a=>!S.ay[a.a]); lesson(no,j<0?0:j,false); }
function lesson(no,j,review){
  const s=BY[no],a=s.ayat[j]; const steps=['Dengar','Kenali','Cocokkan','Susun'];
  const p=panel(`${s.name} · Ayat ${a.n} dari ${s.ayat.length}`,review?'Murajaah':`Membantu ${QUEST[no].npc}`,()=>{});
  const body=p.querySelector('.pbody');
  const bar=$(`<div class="steps">${steps.map(()=>'<i></i>').join('')}</div>`); body.before(bar);
  const mist={match:0,arrange:0};
  function go(n){ stopAudio(); [...bar.children].forEach((x,k)=>x.className=k<n?'past':k===n?'on':'');
    body.replaceChildren([dengar,kenali,cocokkan,susun][n](s,a,()=>n<3?go(n+1):finish(),mist)); p.scrollTop=0; }
  function finish(){
    const first=!S.ay[a.a]; S.ay[a.a]=true; a.w.forEach(w=>bump(w.a,2));
    const stars=1+(mist.match===0?1:0)+(mist.arrange===0?1:0); S.stars[a.a]=Math.max(S.stars[a.a]||0,stars);
    const coins=first?COIN_PER_AYAH:2; S.coins+=coins; save();
    sfx.fanfare(); voice(stars===3?'flawless_victory':'you_win',150);
    addXP(first?20+5*stars:repXP('ay'+a.a,10));
    const lastAyah=j===s.ayat.length-1;
    celebrate(praiseLine(),`Ayat ${a.n} ${s.name} selesai. +${coins} Koin Makna!`,null,()=>{
      if(review){closePanel();well();return;}
      if(!lastAyah){lesson(no,j+1,false);return;}
      if(surahDone(no)&&!S.solved[no]&&!S.whole[no]){ closePanel(); suratUtuh(no,false); return; }
      if(surahDone(no)&&!S.solved[no]){ S.solved[no]=true; S.leaving={no,from:SPOT[no]}; save(); closePanel(); farm();
        setTimeout(()=>dialog(QUEST[no],QUEST[no].done,[['Ke Toko Benih',shop,'green'],['Nanti',idleDialog,'ghost']]),50); }
      else {closePanel();farm();}
    },stars);
  }
  go(0);
}

function poolFor(s,a){ let list=a.w.slice(); const m=new Set(list.map(w=>w.id)),r=new Set(list.map(w=>w.ar));
  if(list.length<4){for(const ay of s.ayat){if(ay.n>=a.n)break;for(const w of ay.w){if(list.length>=4)break;if(!m.has(w.id)&&!r.has(w.ar)){list.push(w);m.add(w.id);r.add(w.ar);}}}}
  const out=[],mm=new Set(),rr=new Set();for(const w of list){if(mm.has(w.id)||rr.has(w.ar))continue;mm.add(w.id);rr.add(w.ar);out.push(w);}return out; }

function susun(s,a,next,mist){
  const v=$(`<div class="frame"><h2>Susun ayatnya</h2><p class="lead">Ketuk kata sesuai urutan bacaan, dari kanan ke kiri. Ketuk kotak untuk mengembalikan kata.</p><div class="slots"></div><div class="pool"></div><div class="fb" aria-live="polite"></div><div class="row" style="margin-top:10px"><button class="btn blue" id="pl">▶ Dengar ayat</button></div><button class="btn green block" id="nx" style="margin-top:12px" disabled>Cek susunan</button></div>`);

/* ---------- question generator (watering + bosses) ---------- */
function learnedWords(nos){ return nos.flatMap(n=>BY[n].ayat.filter(a=>S.ay[a.a]).flatMap(a=>a.w.map(w=>({w,a,no:n})))); }
function weighted(list){ const tot=list.reduce((s,x)=>s+(4-Math.min(3,lv(x.w.a))),0); let r=Math.random()*tot; for(const x of list){r-=4-Math.min(3,lv(x.w.a)); if(r<=0) return x;} return list[0]; }
function makeQ(nos,types){
  const L=learnedWords(nos); if(!L.length) return null;
  const allW=[...new Map(DATA.flatMap(s=>s.ayat.flatMap(a=>a.w)).map(w=>[w.id,w])).values()];
  const learnedNos=nos.filter(n=>BY[n].ayat.some(a=>S.ay[a.a]));
  let type=pick(types||['meaning','meaning','listen','next','surah']);
  if(type==='surah'&&learnedNos.length<2) type='meaning';
  const it=weighted(L), w=it.w;
  if(type==='next'){ const k=it.a.w.indexOf(w); if(k<1) type='meaning'; else {
    const others=shuffle([...new Map(L.map(x=>x.w).filter(x=>x.ar!==w.ar).map(x=>[x.ar,x])).values()]).slice(0,2);
    if(others.length<2) type='meaning'; else {
    const opts=shuffle([w,...others]);
    return {w,html:`<div class="lead">Kata apa sesudahnya?</div><div class="ar ayah" lang="ar">${it.a.w.slice(0,k).map(x=>esc(x.ar)).join(' ')} …</div>`,opts:opts.map(o=>({label:o.ar,ar:true,ok:o===w})),audio:null}; } } }
  if(type==='surah'){ const opts=shuffle([it.no,...shuffle(learnedNos.filter(n=>n!==it.no)).slice(0,2)]);
    return {w,html:`<div class="lead">Ayat ini dari surat apa?</div><div class="ar ayah" lang="ar">${esc(it.a.ar)}</div>`,opts:opts.map(n=>({label:BY[n].name,ok:n===it.no})),audio:AA(it.a.a)}; }
  if(type==='listen'){ const others=shuffle([...new Map(L.map(x=>x.w).filter(x=>x.ar!==w.ar).map(x=>[x.ar,x])).values()]).slice(0,2);
    if(others.length>=2){ const opts=shuffle([w,...others]); return {w,html:`<div class="lead">Dengarkan! Kata mana yang dibaca?</div><button class="btn blue" data-replay>▶ Dengar lagi</button>`,opts:opts.map(o=>({label:o.ar,ar:true,ok:o===w})),audio:AW(w.a)}; } }
  const opts=shuffle([w,...shuffle(allW.filter(x=>x.id!==w.id&&x.ar!==w.ar)).slice(0,2)]);
  return {w,html:`<div class="lead">Apa artinya?</div><div class="ar" lang="ar">${esc(w.ar)}</div>`,opts:opts.map(o=>({label:o.id,ok:o===w})),audio:AW(w.a)};
}
function renderQ(host,q,onAnswer){
  const v=$(`<div><div class="qprompt">${q.html}</div><div class="opts">${q.opts.map((o,n)=>`<button class="opt${o.ar?' ar':''}" ${o.ar?'lang="ar"':''} data-n="${n}">${esc(o.label)}</button>`).join('')}</div><div class="fb" aria-live="polite"></div></div>`);
  if(q.audio) play(q.audio); const rp=v.querySelector('[data-replay]'); if(rp) rp.onclick=()=>play(q.audio);
  const t0=performance.now(); let ans=false;
  v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ if(ans) return; ans=true; const o=q.opts[+b.dataset.n]; const ms=performance.now()-t0;
    if(o.ok){b.classList.add('good');} else {b.classList.add('bad');v.querySelectorAll('.opt')[q.opts.findIndex(x=>x.ok)].classList.add('good');}
    onAnswer(o.ok,ms,v.querySelector('.fb')); });
  host.replaceChildren(v);
}

      if(first) setTimeout(()=>dialog(QUEST[107],['Terima kasih, {n}! Lihat wajah anak-anak itu, mereka tersenyum.','Ingat Al-Ma\'un: jangan menghardik anak yatim, dan ajak orang memberi makan orang miskin.','Sekarang Pak Hasan si pedagang sedang mencarimu.']),60);}),700);
  }

}

/* ---------- BOSS 4: caterpillar attack (Al-Fil: "seperti daun yang dimakan ulat") ---------- */
function pestGame(){
  const B=BOSS.boss4;
  const pn=panel(B.title,'Jawab benar untuk memanggil burung pemakan ulat.',()=>{},()=>farm());
  const body=pn.querySelector('.pbody');
  const W=192,H=112, LANES=5, LY=i=>14+i*19, PLANTX=10, TOTAL=12;
  const v=$(`<div><canvas class="mg" width="${W}" height="${H}"></canvas><div class="mgbar"><span>Tanaman selamat: <span id="pl">5</span>/5</span><span>Ulat: <span id="ul">0</span>/${TOTAL}</span></div><div class="frame"><div class="qh"></div></div></div>`);
  body.append(v); const c=v.querySelector('canvas').getContext('2d'); c.imageSmoothingEnabled=false;
  const plants=Array.from({length:LANES},()=>({hp:3}));
  let worms=[], birds=[], spawned=0, cleared=0, nextSpawn=1.5, over=false, started=false, streak=0, last=performance.now(), rid, time=0;
  function drawPlant(X,Y,hp){ if(hp<=0){px(c,X+5,Y+8,3,4,'#6E4426');return;} px(c,X+6,Y+4,2,9,'#3E8E35'); if(hp>=1)px(c,X+1,Y+6,5,4,'#5DBB4A'); if(hp>=2)px(c,X+8,Y+5,5,4,'#5DBB4A'); if(hp>=3)px(c,X+3,Y,7,5,'#4CA63C'); }
  function drawWorm(X,Y,t){ const w=Math.floor(t/200)%2; for(let i=0;i<4;i++)px(c,X+i*3,Y+(i%2===w?0:1),3,3,i===0?'#7CB342':'#9CCC65'); px(c,X,Y,1,1,'#2B1D12'); }
  function drawBird(X,Y,t){ const f=Math.floor(t/90)%2; px(c,X,Y+2,6,3,'#5A3820'); px(c,X+5,Y+1,2,2,'#5A3820'); px(c,X+7,Y+2,2,1,'#F4B400'); px(c,X+1,Y+(f?-1:3),4,2,'#8E5A33'); }
  function drawScene(t){
    px(c,0,0,W,H,'#8A5A33'); for(let i=0;i<LANES;i++){px(c,0,LY(i)+12,W,2,'#6E4426');}
    px(c,0,0,22,H,'#5A3A22');
    plants.forEach((p,i)=>drawPlant(PLANTX-6,LY(i)-2,p.hp));
    worms.forEach(wm=>drawWorm(Math.round(wm.x),LY(wm.lane)+6,t));
    birds.forEach(b=>drawBird(Math.round(b.x),Math.round(b.y),t));
  }
  function target(){ return worms.filter(w=>!w.targeted).sort((a,b)=>a.x-b.x)[0]; }
  function sendBird(){ const w=target(); if(!w) return false; w.targeted=true; birds.push({x:W-10,y:-6,w}); return true; }
  function frameLoop(t){ rid=requestAnimationFrame(frameLoop); const dt=Math.min(0.1,(t-last)/1000); last=t;
    if(!document.body.contains(v)){cancelAnimationFrame(rid);return;}
    if(started&&!over){ time+=dt;
      if(!worms.length&&nextSpawn>0.7) nextSpawn=0.7; nextSpawn-=dt; if(nextSpawn<=0&&spawned<TOTAL){ const alive=plants.map((p,i)=>i).filter(i=>plants[i].hp>0); const lane=alive.length?pick(alive):Math.floor(Math.random()*LANES); worms.push({x:W,lane,targeted:false}); spawned++; nextSpawn=3.6+Math.random()*1.2; v.querySelector('#ul').textContent=spawned; }
      worms.forEach(w=>{ w.x-=11*dt; });
      worms=worms.filter(w=>{ if(w.x<=PLANTX+4){ const p=plants[w.lane]; if(p.hp>0){p.hp--;sfx.bad();} birds=birds.filter(b=>b.w!==w); return false;} return true; });
      birds.forEach(b=>{ const tx=b.w.x, ty=LY(b.w.lane)+2; const dx=tx-b.x, dy=ty-b.y, d=Math.hypot(dx,dy); const sp=150*dt; if(d<=sp){ b.done=true; } else { b.x+=dx/d*sp; b.y+=dy/d*sp; } });
      birds.filter(b=>b.done).forEach(b=>{ worms=worms.filter(w=>w!==b.w); cleared++; sfx.coin(); });
      birds=birds.filter(b=>!b.done);
      v.querySelector('#pl').textContent=plants.filter(p=>p.hp>0).length;
      if(spawned>=TOTAL&&!worms.length&&!birds.length){ over=true; finish(); }
    }
    drawScene(t);
  }
  const ask=()=>{ if(over) return; const q=makeQ(B.pool);
    renderQ(v.querySelector('.qh'),q,(ok,ms,fb)=>{ if(over) return;
      if(ok){ const n=ms<3000?2:1; let sent=0; for(let i=0;i<n;i++) if(sendBird()) sent++; streak++; S.lv[q.w.a]=Math.min(3,lv(q.w.a)+1); sfx.boost(); fb.className='fb good'; fb.textContent=sent?(n===2?'Dua burung datang!':'Burung datang!'):'Benar! Belum ada ulat, burung siaga.'; if(streak%3===0){comboPop(streak);voice('combo');} }
      else { streak=0; sfx.bad(); fb.className='fb bad'; fb.textContent='Belum tepat. Lihat jawaban yang hijau.'; }
      save(); setTimeout(ask, ok?450:1300); }); };
  function finish(){
    const saved=plants.filter(p=>p.hp>0).length;
    if(saved===0){ const box=$(`<div class="frame" style="margin-top:10px;text-align:center"><div style="font-size:24px;font-weight:700;color:var(--red)">Tanamannya habis dimakan ulat…</div><p>Ayo coba lagi. Jawab lebih cepat supaya datang dua burung sekaligus.</p><button class="btn green block">Coba lagi ▸</button></div>`); box.querySelector('button').onclick=()=>{closePanel();pestGame();}; v.querySelector('.frame').replaceWith(box); return; }
    const first=!S.trophies.boss4; S.trophies.boss4=true; if(first){const gn=giverNo('boss4'); S.leaving={no:gn,from:SPOT['boss4']};} const coins=first?60+10*saved:5*saved; S.coins+=coins; S.best4=Math.max(S.best4||0,saved); save(); addXP(first?80:repXP('boss4',15));
    sfx.fanfare(); voice(saved===5?'flawless_victory':'winner');
    setTimeout(()=>celebrate(`${saved} tanaman selamat!`,`Ulatnya habis! +${coins} Koin Makna.`,ICON.trophy('#3A9D6A'),()=>{closePanel();farm();
      if(first) setTimeout(()=>dialog(QUEST[110],['{n}, selama ini kamu sudah banyak membantu warga.','Kamu menjawab masalah mereka dengan Al-Qur\'an, menangkap maling, mengantar bekal untuk anak yatim, dan menyelamatkan kebun dari hama.'+(Object.values(S.vh||{}).filter(Boolean).length?` Kamu juga sudah membantu memperbaiki ${Object.values(S.vh).filter(Boolean).length} rumah warga.`:''),'Karena kontribusimu untuk desa, aku menghadiahkan tanah di ujung timur: 6 petak baru untukmu!','Terima kasih, {n}. Barakallahu fiik.'],[['Lihat tanahnya ▸',()=>{S.pos={x:19,y:4};save();farm();},'green']]),60);}),700);
  }
  const qh=v.querySelector('.qh'); qh.innerHTML='<div class="qprompt"><div style="font-size:40px;font-weight:700">Siap…</div></div>';
  voice('ready'); setTimeout(()=>{started=true;last=performance.now();ask();},1300);
  rid=requestAnimationFrame(frameLoop);
}

 114:{ayah:4,q:'{n}, ayat mana yang menjelaskan bisikan di hatiku itu?',yes:'Iya! Bisikan itu dari setan yang bersembunyi. Aku berlindung kepada Allah darinya.'},

function levelOf(xp){let l=1;for(let i=2;i<LV_XP.length;i++) if(xp>=LV_XP[i]) l=i; return l;}
const pLevel=()=>levelOf(S.xp||0);
const perk=l=>pLevel()>=l;
let NOTES=[];
function note(title,sub,img){NOTES.push({title,sub,img});}
function flushNotes(){ if(!NOTES.length||document.querySelector('.celebrate')||layer.children.length) return; const n=NOTES.shift(); sfx.fanfare(); voice('winner'); celebrate(n.title,n.sub,n.img,()=>{ const c=document.getElementById('coins'); if(c) c.textContent=S.coins; const l=document.getElementById('lvl'); if(l) l.firstChild.textContent='Lv '+pLevel(); setTimeout(flushNotes,200); }); }
function xpPop(n){ const c=$(`<div class="xppop">+${n} XP</div>`); document.body.append(c); setTimeout(()=>c.remove(),1300); }
function addXP(n){ if(!n||n<=0) return; const before=pLevel(); S.xp=(S.xp||0)+n; save(); xpPop(n); const after=pLevel();
  for(let l=before+1;l<=after;l++){ const un=[]; if(PERKS[l]) un.push(PERKS[l]); HOUSE_TIERS.forEach(h=>{ if(h.lv===l) un.push(`${h.name} bisa dibangun (${h.cost} koin, lewat menu Rumah)`); });
    note(`Naik ke Level ${l}!`,`Kamu sekarang ${TITLES[l]}.${un.length?' Terbuka: '+un.join('. ')+'.':''}`,ICON.star); }
  checkSurahLevels(); }
function repXP(key,base){ S.rep=S.rep||{}; const r=S.rep[key]; const cnt=(r&&r.d===S.day)?r.c:0; S.rep[key]={d:S.day,c:cnt+1}; return cnt===0?base:cnt===1?Math.round(base/2):0; }
function surahLevel(no){ const s=BY[no]; if(!s.ayat.every(a=>S.ay[a.a])) return 0; if(!(S.whole&&S.whole[no])) return 1;
  if(((S.reviews||{})[no]||0)<3) return 2;
  const u=new Map(); words(no).forEach(w=>{const k=w.ar+'|'+w.id; u.set(k,Math.max(u.get(k)||0,lv(w.a)));}); const vals=[...u.values()];
  if(vals.filter(v=>v>=3).length/vals.length<0.8) return 3;
  if(s.ayat.every(a=>(S.stars[a.a]||0)>=3)&&((S.wholeStars||{})[no]||0)>=3) return 5; return 4; }
const slvHint=(no,l)=>l>=5?'Level tertinggi! Tanamanmu jadi tanaman emas.':'Berikutnya: '+['selesaikan semua ayat.','selesaikan Surat Utuh.','ulangi surat ini 3 kali (menyiram atau Surat Utuh).','jadikan 80% kartu kata surat ini emas.','dapatkan 3 bintang di semua ayat dan Surat Utuh.'][l];
function checkSurahLevels(silent){ S.slv=S.slv||{}; ORDER.forEach(no=>{ const l=surahLevel(no), prev=S.slv[no]||0; if(l>prev){ S.slv[no]=l; if(!silent&&l>=2) note(`${BY[no].name} naik ke Level ${l}: ${SLV_NAMES[l]}!`,slvHint(no,l)+(l===3?' Tanaman '+QUEST[no].cropName+' lebih sering panen jumbo.':''),ICON.crop(no)); } }); save(); }
function addReview(no){ S.reviews=S.reviews||{}; S.reviews[no]=(S.reviews[no]||0)+1; save(); checkSurahLevels(); }
const canBuild=()=>{ const nx=HOUSE_TIERS[S.house+1]; return !!nx&&!S.building&&pLevel()>=nx.lv; };
const renoOpen=()=>!!S.solved[107];
function renoNext(no){ const t=(S.vh||{})[no]||0; const nx=VTIERS[t+1]; if(!nx) return null; return {tier:t+1,...nx,ok:(S.slv[no]||0)>=nx.slv}; }
const renoReady=no=>{ if(!renoOpen()) return false; const r=renoNext(no); return !!r&&r.ok&&S.coins>=r.cost; };

/* migration for players from earlier versions */
(function migrate(){ if(!S.hv2){ S.house=S.house===1?2:S.house===2?3:S.house||0; S.hv2=true; }
  if(S.xp===undefined){ let x=0; Object.keys(S.ay).forEach(k=>{x+=20+5*(S.stars[k]||1);}); ['boss1','boss2','boss3','boss4'].forEach(b=>{if(S.trophies[b])x+=80;}); x+=Object.keys(S.basket||{}).length*10; S.xp=x; }
  S.vh=S.vh||{}; S.whole=S.whole||{}; S.wholeStars=S.wholeStars||{}; S.reviews=S.reviews||{}; checkSurahLevels(true); save(); })();

/* ---------- Jurnal Misi ---------- */
function journal(){
  panel('Jurnal Misi',`Level ${pLevel()} · ${TITLES[pLevel()]} · ${S.xp||0} XP`,v=>{
    const L=pLevel(), next=LV_XP[L+1];
    v.append($(`<div class="box"><h3>Level Petani ${L}: ${TITLES[L]}</h3><div class="xpbar"><div style="width:${next?Math.min(100,((S.xp-LV_XP[L])/(next-LV_XP[L]))*100):100}%"></div></div><p class="small" style="margin:6px 0 0">${next?`${next-S.xp} XP lagi ke Level ${L+1}${PERKS[L+1]?` · hadiah: ${PERKS[L+1]}`:''}${HOUSE_TIERS.find(h=>h.lv===L+1)?` · ${HOUSE_TIERS.find(h=>h.lv===L+1).name} bisa dibangun`:''}`:'Level tertinggi!'}</p></div>`));
    const e=activeEvent();
    EVENTS.forEach((ev,i)=>{
      const unlocked=done(ev)||ev===e; const isNum=typeof ev==='number';
      if(!unlocked){ v.append($(`<div class="box mission lock"><h3>??? Misi ${i+1}</h3><p class="small" style="margin:0">Terbuka setelah misi sebelumnya selesai.</p></div>`)); return; }
      if(!isNum){ v.append($(`<div class="box mission${ev===e?' cur':''}"><h3>${done(ev)?'✔':'⚔'} ${MTITLE[ev]}</h3><p class="small" style="margin:0">${done(ev)?'Selesai! Main lagi dari Lemari Piala di rumah.':'Misi besar! Hampiri '+BOSS[ev].giver.npc+' yang bertanda seru (!).'}</p></div>`)); return; }
      const no=ev, s=BY[no], Q=QUEST[no], nA=s.ayat.filter(a=>S.ay[a.a]).length, sl=S.slv[no]||0;
      const obj=[[`Dengar masalah ${Q.npc}`,!!(S.arrived&&S.arrived[no])||nA>0],[`Pelajari ${s.ayat.length} ayat (${nA}/${s.ayat.length})`,nA===s.ayat.length],['Surat Utuh: cerita, urutan ayat, jelaskan ke warga',!!S.whole[no]],[`Tanam Benih ${Q.cropName}`,!!(S.bought&&S.bought[no])],[`Panen ${Q.cropName} pertama`,(S.basket[no]||0)>0]];
      const box=$(`<div class="box mission${ev===e?' cur':''}"><h3>${done(ev)?'✔':'📜'} ${MTITLE[no]} <span class="small" style="color:#6A4E36">· Surat ${s.name}</span></h3>
        <ul class="milestones">${obj.map(([t,d])=>`<li><b>${d?'☑':'☐'}</b>${esc(t)}</li>`).join('')}</ul>
        <p class="small" style="margin:8px 0 0">Level Pemahaman: <b>${'★'.repeat(sl)}${'☆'.repeat(5-sl)}</b> ${SLV_NAMES[sl]}${sl>=1?' · '+slvHint(no,sl):''}</p></div>`);
      if(surahDone(no)){ const b=$(`<button class="btn blue" style="margin-top:8px">${S.whole[no]?'Ulangi Surat Utuh':'Mulai Surat Utuh'} ▸</button>`); b.onclick=()=>suratUtuh(no,!!S.solved[no]); box.append(b); }
      v.append(box); });
  });
}

/* ---------- Surat Utuh ---------- */
function suratUtuh(no,review){
  const s=BY[no], Q=QUEST[no];
  const pn=panel(`Surat Utuh · ${s.name}`,review?'Murajaah surat utuh':`Langkah terakhir membantu ${Q.npc}`,()=>{});
  const body=pn.querySelector('.pbody');
  const bar=$(`<div class="steps"><i></i><i></i><i></i></div>`); body.before(bar);
  let mist=0;
  const go=n=>{ stopAudio(); [...bar.children].forEach((x,k)=>x.className=k<n?'past':k===n?'on':''); body.replaceChildren([cerita,urutan,jelaskan][n](()=>n<2?go(n+1):finish())); pn.scrollTop=0; };
  function cerita(next){
    const v=$(`<div class="frame"><h2>Cerita Surat ${esc(s.name)}</h2><p class="lead">Dengarkan surat utuh. Arti tiap ayat muncul seperti cerita. Nanti ada jeda pertanyaan.</p><div class="story"></div><div class="qh"></div><button class="btn green block" id="nx" style="margin-top:12px" hidden>Lanjut ▸</button></div>`);
    const story=v.querySelector('.story'), qh=v.querySelector('.qh');
    const checkAt=new Set([Math.floor((s.ayat.length-1)/2), s.ayat.length-1]);
    let i=0;
    const playNext=async()=>{
      if(!document.body.contains(v)) return;
      if(i>=s.ayat.length){ v.querySelector('#nx').hidden=false; story.querySelectorAll('.srow').forEach(r=>r.classList.remove('now')); return; }
      const a=s.ayat[i]; const row=$(`<div class="srow now"><span class="n">${a.n}</span><div class="ar" lang="ar">${esc(a.ar)}</div><div class="tr">${esc(a.tr)}</div></div>`);
      story.querySelectorAll('.srow').forEach(r=>r.classList.remove('now')); story.append(row);
      await play(AA(a.a));
      if(!document.body.contains(v)) return;
      const k=i; i++;
      if(checkAt.has(k)) ask(k); else setTimeout(playNext,250);
    };
    const ask=k=>{ const a=s.ayat[k]; const opts=shuffle([a,...shuffle(s.ayat.filter(x=>x!==a)).slice(0,2)]);
      const q=$(`<div class="frame" style="margin-top:10px;background:#FFF6CC"><b>Jeda sebentar!</b> Ayat ${a.n} yang baru dibaca artinya apa?<div class="opts">${opts.map((o,n)=>`<button class="opt" data-n="${n}" style="font-weight:500">${esc(o.tr)}</button>`).join('')}</div><div class="fb"></div></div>`);
      qh.replaceChildren(q);
      let ans=false; q.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ if(ans) return; ans=true; const o=opts[+b.dataset.n]; const fb=q.querySelector('.fb');
        if(o===a){b.classList.add('good');sfx.good();fb.className='fb good';fb.textContent='Benar! Lanjut ceritanya…';} else {mist++;b.classList.add('bad');q.querySelectorAll('.opt')[opts.indexOf(a)].classList.add('good');sfx.bad();fb.className='fb bad';fb.textContent='Yang benar yang hijau. Lanjut…';}
        setTimeout(()=>{qh.replaceChildren();playNext();},1400); }); };
    v.querySelector('#nx').onclick=next;
    setTimeout(playNext,300); return v;
  }
  function urutan(next){
    const v=$(`<div class="frame"><h2>Susun urutan ayat</h2><p class="lead">Ketuk ayat dari yang pertama sampai yang terakhir. Ketuk ▶ untuk mendengar ayatnya dulu.</p><div class="ostack"></div><div class="pool2"></div><div class="fb"></div><button class="btn green block" id="nx" style="margin-top:12px" disabled>Cek urutan</button></div>`);
    const stack=v.querySelector('.ostack'), pool=v.querySelector('.pool2'), fb=v.querySelector('.fb'), nx=v.querySelector('#nx');
    const placed=[]; let solved=false; const els=new Map();
    shuffle(s.ayat.map((a,k)=>({a,k}))).forEach(it=>{ const el=$(`<div class="aytile"><button class="pl" aria-label="Dengar ayat">▶</button><button class="tx ar" lang="ar">${esc(it.a.ar)}</button></div>`);
      el.querySelector('.pl').onclick=()=>play(AA(it.a.a));
      el.querySelector('.tx').onclick=()=>{ if(solved||placed.includes(it)) return; placed.push(it); el.classList.add('used'); play(AA(it.a.a)); render(); };
      els.set(it,el); pool.append(el); });
    function render(){ stack.replaceChildren(...placed.map((it,i)=>{ const r=$(`<button class="orow"><span class="num">${i+1}</span><span class="ar" lang="ar">${esc(it.a.ar)}</span></button>`); r.onclick=()=>{ if(solved) return; placed.splice(i,1); els.get(it).classList.remove('used'); fb.textContent=''; render(); }; return r; }));
      if(!placed.length) stack.append($(`<div class="hint" style="padding:8px">Ayat pertama ditaruh di sini…</div>`)); nx.disabled=placed.length<s.ayat.length&&!solved; }
    render();
    nx.onclick=()=>{ if(solved){next();return;} const wrong=placed.map((it,i)=>it.k!==i);
      if(wrong.some(Boolean)){ mist++; sfx.bad(); fb.className='fb bad'; fb.textContent='Ada yang belum di tempatnya (merah). Ketuk untuk mengembalikan, lalu coba lagi.'; [...stack.querySelectorAll('.orow')].forEach((r,i)=>r.classList.toggle('bad',wrong[i])); }
      else { solved=true; sfx.good(); fb.className='fb good'; fb.textContent='Urutannya benar!'; nx.textContent='Lanjut ▸'; } };
    return v;
  }
  function jelaskan(next){
    const E=EXPLAIN[no]; const a=s.ayat[E.ayah-1]; const opts=shuffle([a,...shuffle(s.ayat.filter(x=>x!==a)).slice(0,2)]);
    const v=$(`<div class="frame"><h2>Jelaskan ke ${esc(Q.npc)}</h2><div style="display:flex;gap:10px;align-items:flex-start;margin:6px 0 4px"><img alt="" src="${portrait(Q.look)}" style="width:56px;height:56px;border:3px solid var(--ink);border-radius:4px;image-rendering:pixelated;flex:none"><div><div style="font-weight:700;color:var(--red)">${esc(Q.npc)}</div><p style="margin:2px 0 0">${esc(fill(E.q))}</p></div></div>
      <div class="opts">${opts.map((o,n)=>`<button class="opt" data-n="${n}"><span class="ar" lang="ar" style="display:block;font-size:24px;text-align:right;line-height:1.9">${esc(o.ar)}</span><span style="font-weight:500">${esc(o.tr)}</span></button>`).join('')}</div><div class="fb"></div><button class="btn green block" id="nx" style="margin-top:12px" hidden>Lanjut ▸</button></div>`);
    let fin=false;
    v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ if(fin) return; const o=opts[+b.dataset.n]; const fb=v.querySelector('.fb'); play(AA(o.a));
      if(o===a){ fin=true; b.classList.add('good'); sfx.good(); fb.className='fb good'; fb.textContent=`${Q.npc}: "${fill(E.yes)}"`; v.querySelector('#nx').hidden=false; }
      else { mist++; b.classList.add('bad'); sfx.bad(); fb.className='fb bad'; fb.textContent='Hmm, ayat itu membahas hal lain. Coba pilih ayat yang lain.'; setTimeout(()=>b.classList.remove('bad'),900);} });
    v.querySelector('#nx').onclick=next; return v;
  }
  function finish(){
    const first=!S.whole[no]; S.whole[no]=true; const stars=mist===0?3:mist<=2?2:1; S.wholeStars[no]=Math.max(S.wholeStars[no]||0,stars);
    const coins=first?20:3; S.coins+=coins; save();
    sfx.fanfare(); voice(stars===3?'flawless_victory':'winner',150);
    const xp=first?50:repXP('whole'+no,10);
    celebrate(`Surat ${s.name} utuh!`,`Kamu memahami surat ini dari awal sampai akhir. +${coins} koin.`,null,()=>{
      if(!first) addReview(no);
      addXP(xp); checkSurahLevels();
      if(review||S.solved[no]){ closePanel(); farm(); return; }
      S.solved[no]=true; S.leaving={no,from:SPOT[no]}; save(); closePanel(); farm();
      setTimeout(()=>dialog(QUEST[no],QUEST[no].done,[['Ke Toko Benih',shop,'green'],['Nanti',idleDialog,'ghost']]),50);
    },stars);
  }
  go(0);
}

/* ---------- membangun rumah pemain ---------- */
function buildBox(){
  const cur=HOUSE_TIERS[S.house], nx=HOUSE_TIERS[S.house+1];
  const b=$(`<div class="box"><h3>Bangun rumah</h3><p class="small" style="margin:0 0 8px">Sekarang: <b>${cur.name}</b>. Butuh Level Petani dan Koin Makna. Rumah selesai dibangun besok pagi.</p><div class="list"></div></div>`);
  const list=b.querySelector('.list');
  HOUSE_TIERS.forEach((h,i)=>{ if(i===0) return; const doneT=S.house>=i, building=S.building&&S.building.tier===i, next=i===S.house+1;
    const lvOk=pLevel()>=h.lv, coinOk=S.coins>=h.cost;
    const it=$(`<div class="item"><div class="t"><b>${doneT?'✔ ':building?'🔨 ':''}${h.name}</b><span>${doneT?'Sudah dibangun':building?'Sedang dibangun, jadi besok pagi':`Butuh Level ${h.lv} ${lvOk?'✔':'✗'} · ${h.cost} koin ${coinOk?'✔':'✗'}`}</span></div>${next&&!S.building?`<button class="btn" ${lvOk&&coinOk?'':'disabled'}>Bangun</button>`:''}</div>`);
    const btn=it.querySelector('button'); if(btn) btn.onclick=()=>{ S.coins-=h.cost; S.building={tier:i}; save(); sfx.plant(); closePanel(); farm(); toast(`Tukang mulai membangun ${h.name}! Selesai besok pagi.`); };
    list.append(it); });
  return b;
}

/* ---------- renovasi rumah warga ---------- */
function villagerTalk(no){
  const Q=QUEST[no]; const lines=[`Ini rumahku, ${S.name}. `+fill(Q.thanks)];
  if(!renoOpen()){ dialog(Q,lines); return; }
  const r=renoNext(no);
  if(!r){ dialog(Q,lines.concat(['Rumahku sekarang indah sekali. Terima kasih sudah membantu, '+S.name+'!'])); return; }
  if(!r.ok){ dialog(Q,lines.concat([`Kalau kamu sudah lebih paham Surat ${BY[no].name} (Level ${r.slv}: ${SLV_NAMES[r.slv]}), kamu bisa membantu memperbaiki rumahku. Sekarang Level ${S.slv[no]||0}.`])); return; }
  dialog(Q,lines.concat([`Kamu sudah paham Surat ${BY[no].name}. Mau membantu memperbaiki rumahku jadi ${r.name}? Butuh ${r.cost} koin.`]),[[`Bantu (${r.cost} koin)`,()=>{
    if(S.coins<r.cost){ toast(`Koinmu belum cukup (${S.coins}/${r.cost}).`); return; }
    S.coins-=r.cost; S.vh[no]=r.tier; save(); sfx.chest(); addXP(25);
    renoFx={no,until:performance.now()+2500};
    note(`Rumah ${Q.npc} jadi ${r.name}!`,`Kamu membantu tetangga, seperti pesan Surat Al-Ma'un. ${Q.npc} akan sesekali memberi hadiah terima kasih di pagi hari.`,ICON.star);
    farm(); setTimeout(flushNotes,2600);
  },'green'],['Nanti',idleDialog,'ghost']]);
}
let renoFx=null;

/* ---------- onboarding ---------- */
function onboarding(){
  root.replaceChildren($(`<div class="title"><h1>Kebun Makna</h1><p>Ayo bangun kebunmu!</p></div>`));
  const f=$(`<div class="frame"><img class="portrait" alt="" style="float:left;margin:0 12px 6px 0;width:64px;height:64px;border:3px solid var(--ink);image-rendering:pixelated" src="${portrait(KAKEK.look)}">
    <div class="who" style="font-weight:700;color:var(--red)">Kakek Umar</div><p style="margin:2px 0 10px">Selamat datang di desa! Kakek punya sebidang tanah kosong dan gubuk kecil untukmu. Siapa namamu?</p>
    <div class="field" style="clear:both"><label for="nm"><b>Namamu</b></label><input id="nm" maxlength="16" autocomplete="off" placeholder="Tulis namamu" value="${esc(S.name)}"></div>
    <b>Pilih tokohmu</b><div class="avatars" style="margin:8px 0 14px"></div>
    <button class="btn green block" id="go">Mulai berkebun ▸</button><p class="hint" id="err" style="margin:8px 0 0"></p></div>`);
  const avs=f.querySelector('.avatars');
  AVATARS.forEach((A,i)=>{const b=$(`<button class="av${S.avatar===i?' on':''}"><canvas width="12" height="16"></canvas><span>${A.name}</span></button>`);drawKid(b.querySelector('canvas').getContext('2d'),0,0,i,0,null);b.onclick=()=>{S.avatar=i;avs.querySelectorAll('.av').forEach(x=>x.classList.remove('on'));b.classList.add('on');sfx.good();};avs.append(b);});
  f.querySelector('#go').onclick=()=>{const n=f.querySelector('#nm').value.trim(); if(!n){f.querySelector('#err').textContent='Tulis namamu dulu, ya.';return;} const isNew=!S.name; S.name=n; save(); sfx.fanfare(); voice('ready'); isNew?intro():farm();};
  root.append(f);
}
function intro(){
  introActive=true; farm();
  dialog(KAKEK,[`Ini kebunmu, ${S.name}. Masih kosong: hanya ada gubuk kecil dan tanah.`,'Di desa ini, benih dibeli dengan Koin Makna. Koin didapat saat kamu memahami arti ayat Al-Qur\'an untuk membantu warga.','Tanam benih, siram setiap hari dengan murajaah, lalu tidur. Besok pagi tanamanmu tumbuh!',`Lihat jam di atas. Satu hari di desa sekitar 16 menit. Nanti warga desa akan datang membawa masalah. Cari orang dengan tanda seru (!).`],[['Siap!',()=>{introActive=false;idleDialog();stepEvents();},'green']]);
}

/* ---------- parent view ---------- */
function parentView(){
  let tab='progres';
  panel('Untuk Orang Tua','Progres, cek arti, pengaturan',(body)=>{
    const tabs=$(`<div class="ptab"><button data-t="progres">Progres</button><button data-t="arti">Cek arti per kata</button><button data-t="atur">Pengaturan &amp; sumber</button></div>`); const inner=$(`<div class="sys"></div>`);
    body.append(tabs,inner);
    const render=()=>{ tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
      if(tab==='progres') inner.replaceChildren($(`<div class="box"><h3>Ringkasan</h3><p class="small" style="margin:0">Hari ke-${S.day} di game · ${Object.keys(S.ay).length}/${DATA.reduce((s,x)=>s+x.ayat.length,0)} ayat · ${ORDER.flatMap(words).filter(w=>lv(w.a)>=3).length}/${ORDER.flatMap(words).length} kata kuat (benar saat menyiram/boss) · rumah tingkat ${S.house+1}</p></div>`),...ORDER.map(no=>{const s=BY[no],ws=words(no),need=ws.filter(w=>lv(w.a)>0&&lv(w.a)<3);
        return $(`<div class="box"><h3>${s.name}</h3><p class="small" style="margin:0 0 6px">${s.ayat.filter(a=>S.ay[a.a]).length}/${s.ayat.length} ayat · ${ws.filter(w=>lv(w.a)>=3).length}/${ws.length} kata kuat · ${S.solved[no]?'masalah warga terjawab':'belum selesai'}</p>${need.length?`<div class="small"><b>Tanyakan lagi saat santai:</b><ul style="margin:6px 0 0;padding-left:20px">${need.map(w=>`<li><span class="ar" lang="ar" style="font-size:20px">${esc(w.ar)}</span> = ${esc(w.id)}</li>`).join('')}</ul></div>`:''}</div>`);}));
      if(tab==='arti') inner.replaceChildren($(`<p class="small" style="margin:0 0 10px">Semua arti yang dipakai di aplikasi. <span class="tag">disesuaikan</span> = ejaan atau pilihan kata kami rapikan, arti asli dari sumber ditulis di bawahnya.</p>`),...ORDER.map(no=>{const s=BY[no];return $(`<div class="box"><h3>${s.name}</h3><div class="tablewrap"><table><thead><tr><th>Ayat</th><th>Kata</th><th>Arti</th></tr></thead><tbody>${s.ayat.map(a=>a.w.map((w,k)=>`<tr><td>${k===0?a.n:''}</td><td class="ar" lang="ar">${esc(w.ar)}</td><td>${esc(w.id)}${w.id!==w.src?`<br><span class="tag">disesuaikan</span> <span class="small" style="color:#6A4E36">sumber: ${esc(w.src)}</span>`:''}</td></tr>`).join('')+`<tr><td></td><td colspan="2" class="small" style="color:#6A4E36">Terjemahan ayat: ${esc(a.tr)}</td></tr>`).join('')}</tbody></table></div></div>`);}));
      if(tab==='atur'){ const b=$(`<div><div class="box"><h3>Pengaturan</h3>
        <label class="toggle"><input type="checkbox" id="unl" ${S.unlockAll?'checked':''}> Buka semua misi tanpa urutan (termasuk boss)</label>
        <label class="toggle"><input type="checkbox" id="sfx" ${S.sfx?'checked':''}> Bunyi efek</label>
        <label class="toggle"><input type="checkbox" id="voi" ${S.voice?'checked':''}> Suara penyiar (rekaman manusia, bahasa Inggris)</label>
        <div class="row" style="margin-top:12px"><button class="btn ghost" id="rn">Ganti nama/tokoh</button><button class="btn ghost" id="rs" style="color:#C0472E">Mulai ulang dari awal</button></div><div id="cf"></div>
        <p class="small" style="margin:10px 0 0">Waktu di game: 1 menit game = 1 detik nyata, jadi satu hari (06:00–22:00) sekitar 16 menit. Waktu berhenti saat menu, pelajaran, atau game boss terbuka. Progres tersimpan di browser perangkat ini saja.</p></div>
        <div class="box"><h3>Sumber</h3><ul class="small" style="padding-left:20px;margin:0">
        <li><b>Arti per kata:</b> terjemah per kata Bahasa Indonesia dari Quran.com (dataset ihzaa/quran-json-indopak-tajweed), dicek silang dengan basis data quranterjemah.com. Pada 109:5 dan 107:3 pemenggalan kata di sumber bergeser, sudah diperbaiki manual. Kata yang dirapikan ditandai di tab Cek arti.</li>
        <li><b>Terjemahan ayat:</b> Kementerian Agama RI, melalui Quran.com.</li>
        <li><b>Bacaan:</b> Syaikh Mishary Rashid Alafasy per ayat (versebyversequran.com). Audio per kata dipotong dari rekaman ayat yang sama; batas kata ditentukan manual mengikuti tajwid.</li>
        <li><b>Suara penyiar</b> ("You win!", "Combo!", "3-2-1"): Kenney Voiceover Pack, kenney.nl, lisensi CC0.</li></ul>
        <p class="small" style="margin:8px 0 0">Bila menemukan arti atau potongan bunyi yang keliru, mohon dicek dengan mushaf terjemah per kata Kemenag atau ustaz/ustazah setempat.</p></div></div>`);
        b.querySelector('#unl').onchange=e=>{S.unlockAll=e.target.checked;save();};
        b.querySelector('#sfx').onchange=e=>{S.sfx=e.target.checked;save();};
        b.querySelector('#voi').onchange=e=>{S.voice=e.target.checked;save();if(S.voice)voice('ready');};
        b.querySelector('#rn').onclick=()=>{closePanel();onboarding();};
        b.querySelector('#rs').onclick=()=>{const cf=b.querySelector('#cf');cf.replaceChildren($(`<div class="confirm small">Kebun, koin, dan progres akan hilang. Yakin? <div class="row" style="margin-top:8px"><button class="btn" id="y" style="background:#F8D2C6">Ya, mulai ulang</button><button class="btn ghost" id="n">Batal</button></div></div>`));cf.querySelector('#y').onclick=()=>{S=fresh();save();closePanel();onboarding();};cf.querySelector('#n').onclick=()=>cf.replaceChildren();};
        inner.replaceChildren(b);}
    };
    tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();}); render();
  });
}

/* ---------- boot ---------- */
if(!S.name) onboarding(); else farm();
</script>
